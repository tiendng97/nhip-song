<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhịp Sống</title>
<meta name="description" content="Sổ quản lý cuộc sống: việc, tiền, sức khỏe, thói quen, mục tiêu">
<meta name="theme-color" content="#1D6A56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nhịp Sống">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: sổ tay hai cột — thanh điều hướng trái trên máy tính, thanh tab dưới trên điện thoại; nội dung là các thẻ xếp lưới tự co giãn */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#16221E; --ink-2:#4D5E58; --ink-3:#7A8A84;
  --line:#D6E0DB; --jade:#1D6A56; --jade-soft:#D6EBE2; --on-jade:#FFFFFF;
  --amber:#A86F14; --amber-soft:#F5E6CA; --red:#B2433A; --red-soft:#F6DEDA; --ok:#2C7A4C; --ok-soft:#DAEFE1;
  --shadow:0 1px 2px rgba(22,34,30,.06),0 4px 14px rgba(22,34,30,.05);
  --g-self:#1D6A56; --g-self-s:#D6EBE2; --g-rel:#B03A5E; --g-rel-s:#F8DDE5; --g-work:#9A600C; --g-work-s:#F6E7CB; --g-life:#2C5AA0; --g-life-s:#DCE6F6;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-size:24px;font-weight:600;padding:4px 12px 2px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.side .sync{margin:2px 12px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:9px;text-align:left;color:var(--ink-2);font-weight:500}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--jade-soft);color:var(--jade)}
.side .spacer{flex:1}
.tools-row{display:flex;flex-direction:column;gap:2px}
.nav-gh{border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:8px}
.nav-gh:hover{background:var(--surface-2)}
.nav-gh span:nth-child(2){flex:1}
.nav-gh .chev{font-size:10px;color:var(--ink-3)}
.nav-icons{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 4px}
.nav-ic{border:0;background:none;padding:2px;border-radius:9px}
.nav-ic:hover,.nav-ic[aria-current="page"]{background:var(--gs)}
.nav-ic .aicon.sm{width:30px;height:30px}
.side .quick-btn{margin:8px 4px 0}

main{padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.sub{color:var(--ink-2);margin:4px 0 0}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .link{font-size:13px;font-weight:500;color:var(--jade);background:none;border:0;padding:0}
.span2{grid-column:1/-1}
.muted{color:var(--ink-3);font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.icon-btn{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:7px;display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.confirm{color:var(--red);background:var(--red-soft)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 140px}
.form{display:flex;flex-direction:column;gap:10px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.jade{background:var(--jade-soft);color:var(--jade)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--ok)}
.sync.local i{background:var(--amber)}

/* Banner mẫu */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);color:var(--ink);padding:14px 16px;border-radius:var(--r)}
.banner p{margin:0;max-width:60ch}
.banner strong{color:var(--amber)}
.banner .row{align-items:center}

/* Danh sách việc */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item.done .t{color:var(--ink-3);text-decoration:line-through}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.item .acts{display:flex;gap:2px;align-items:center}
.check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin:2px 0 0;display:grid;place-content:center;background:var(--surface);cursor:pointer}
.check::after{content:"";width:10px;height:6px;border:2px solid var(--on-jade);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check:checked{background:var(--jade);border-color:var(--jade)}
.check:checked::after{opacity:1}
.prio-2 .check{border-color:var(--red)}
.prio-1 .check{border-color:var(--amber)}
.group-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 2px;display:flex;gap:6px;align-items:center}
.group-h.red{color:var(--red)}
.title-btn.link{color:var(--jade)}
.title-btn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;width:100%}
.editor{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Số liệu */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-size:clamp(20px,3vw,26px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.v.in{color:var(--ok)} .v.out{color:var(--red)}

.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--jade);border-radius:99px}
.bar.warn>span{background:var(--amber)} .bar.over>span{background:var(--red)}
.budget{display:flex;flex-direction:column;gap:5px}
.budget .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.budget .l span:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

.tx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt.in{color:var(--ok)}
.day-h{font-size:12px;font-weight:600;color:var(--ink-3);margin:12px 0 0;text-transform:uppercase;letter-spacing:.05em}

/* Thói quen */
.habit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.habit:first-child{border-top:0}
.habit .name{font-weight:500}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;color:var(--ink-3);font-weight:600}
.dot.part{background:color-mix(in srgb,var(--jade) 35%,var(--surface-2));color:var(--ink)}
.dot.full{background:var(--jade);color:var(--on-jade)}
.dot.today{outline:2px solid var(--ink-2);outline-offset:1px}
.counter{display:flex;align-items:center;gap:6px}
.counter .cnt{min-width:46px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.tap{border:2px solid var(--jade);background:var(--surface);color:var(--jade);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.tap.full{background:var(--jade);color:var(--on-jade)}

.fast{display:flex;flex-direction:column;gap:10px}
.fast .state{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.2}
.ring{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring svg{width:92px;height:92px}

/* Mục tiêu */
.goal{display:flex;flex-direction:column;gap:10px}
.goal .gt{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.25;margin:0;overflow-wrap:anywhere}
.step{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.step.done span{color:var(--ink-3);text-decoration:line-through}
.step .check{width:18px;height:18px;flex:none}

/* Nhật ký */
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.mood[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.entry{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.entry:first-child{border-top:0}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}

/* Biểu đồ */
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:8px}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .b{width:100%;max-width:38px;background:var(--jade);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .lbl{font-size:11px;color:var(--ink-3);font-weight:600}
.chart .val{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Tabbar điện thoại */
.tabbar{display:none}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;border:0;background:var(--jade);color:var(--on-jade);border-radius:999px;padding:13px 20px;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab svg{width:18px;height:18px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:18px calc(150px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-3);padding:6px 2px;border-radius:9px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--jade)}
  .fab{display:inline-flex;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .card{padding:15px}
}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:76vh;overflow:auto}
.sheet h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}
.big-input{font-size:17px!important;padding:13px 14px!important}
.preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
.hints{font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.hints code{font-family:inherit;background:var(--surface-2);color:var(--ink-2);padding:1px 6px;border-radius:5px}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.more-grid .nav-btn{background:var(--bg);padding:14px 12px}
@media (max-width:820px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:16px 16px 0 0;width:100%;max-height:88vh;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.tabs .cnt{font-size:11px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
@media (min-width:821px){.tabs{flex-wrap:wrap;overflow:visible}}
.tabs.one-line{flex-wrap:nowrap!important;overflow-x:auto!important}
.agroup{display:flex;flex-direction:column;gap:8px}
.agroup .group-h{margin:4px 0 0}
.agrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.acard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;color:var(--ink);box-shadow:var(--shadow)}
.acard:hover{border-color:var(--jade)}
.acard .an{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.acard .meta{display:flex;gap:4px;flex-wrap:wrap}
.amod{font-size:13px;color:var(--ink-2)}
.score{font-family:var(--f-body);font-size:13px;font-weight:700;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.score.ok{background:var(--ok-soft);color:var(--ok)}.score.jade{background:var(--jade-soft);color:var(--jade)}.score.red{background:var(--red-soft);color:var(--red)}
.bal{display:flex;flex-direction:column;gap:2px}
.bal-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 54px;gap:10px;align-items:center;border:0;background:none;padding:5px 4px;border-radius:7px;text-align:left;font-size:14px;color:var(--ink)}
.bal-row:hover{background:var(--surface-2)}

/* ---------- Tiện ích ---------- */
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]||1)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const monthKey=s=>s.slice(0,7);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function draftFromAI(d,fileRecs,single){

const OK_TYPES=["image/png","image/jpeg","image/gif","image/webp","application/pdf"];
async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5e6||typeof createImageBitmap!=="function")return f;
  try{const bm=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b&&b.size<f.size?b:f}catch(e){return f}
}

let db=null,uid=null,downloads=null;
const lastRemote={},firstSeen=new Set();
const timers={},inflight={},dirty={};
const LS_KEY="nhipsong-v1";
function docRef(mod){return db.doc("data/users/"+uid+"/"+mod)}
function pick(mod){const o={};MODS[mod].forEach(k=>o[k]=S[k]);return o}
function persist(mod){
  if(mode==="loading"){toast("Đang tải dữ liệu, thử lại sau vài giây");return}
  if(mode==="local"){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast("Không lưu được trên trình duyệt này")}return}
  dirty[mod]=true;clearTimeout(timers[mod]);
  timers[mod]=setTimeout(()=>flush(mod),500);
}
async function flush(mod){
  if(inflight[mod]){timers[mod]=setTimeout(()=>flush(mod),300);return}
  if(!dirty[mod])return;
  dirty[mod]=false;inflight[mod]=true;setSync("saving");
  try{await docRef(mod).set(Object.assign({v:1},pick(mod)))}
  catch(e){
    if(e&&e.code==="unavailable"){dirty[mod]=true;setTimeout(()=>flush(mod),1500+Math.random()*1000)}
    else toast(e&&e.code==="quota_exceeded"?"Bộ nhớ đã đầy — xoá bớt giao dịch cũ rồi thử lại":"Chưa lưu được ("+(e&&e.code||"lỗi")+")");
  }finally{inflight[mod]=false;setSync(Object.values(dirty).some(Boolean)?"saving":"on")}
}
function persistAll(){Object.keys(MODS).forEach(persist)}
let nudged=false;
function demoNudge(){if(!nudged){nudged=true;toast("Đang xem dữ liệu mẫu — bấm “Bắt đầu” ở đầu trang để lưu dữ liệu thật")}}

function applyRemote(mod,data){MODS[mod].forEach(k=>{if(data[k]!==undefined)S[k]=JSON.parse(JSON.stringify(data[k]))});if(mod==="areas"&&data.areasV===undefined)S.areasV=1}
function onSnap(mod,snap){
  firstSeen.add(mod);
  if(snap.exists){
    const data=snap.data();lastRemote[mod]=data;
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    if(dirty[mod]||inflight[mod])return;
    if(mode!=="cloud"){S=blankState();mode="cloud";Object.keys(lastRemote).forEach(m=>applyRemote(m,lastRemote[m]))}
    else applyRemote(mod,data);
    setSync("on");scheduleRender();
  }
  if(!ready&&firstSeen.size===Object.keys(MODS).length){ready=true;if(mode==="loading")mode="cloud";setSync("on");scheduleRender()}
  if(ready&&mode==="cloud")maybeMigrate();
}
let renderPending=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&$("#main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox"){
    if(!renderPending){renderPending=true;a.addEventListener("blur",()=>{renderPending=false;setTimeout(render,50)},{once:true})}
    return;
  }
  render();
}
let syncState="wait";

function paintSync(){
  const el=$("#sync-side");if(!el)return;
  const map={wait:["","Đang kết nối…"],on:["on","Đã đồng bộ mọi thiết bị"],saving:["on","Đang lưu…"],local:["local","Chỉ lưu trên máy này"],demo:["local","Dữ liệu mẫu"]};
  let st=syncState;if(mode==="local")st="local";
  const v=map[st]||map.wait;el.className="sync "+v[0];el.lastElementChild.textContent=v[1];
}

      uid=u?await u.id():null;
      if(d&&uid){
        db=d;

          docRef(mod).onSnapshot(s=>onSnap(mod,s),e=>{if(e&&e.code==="revoked"){toast("Mất quyền truy cập dữ liệu");}});
        });
        setTimeout(()=>{if(!ready){ready=true;if(mode==="loading")mode="cloud";setSync("on");maybeMigrate();render()}},8000);
        render();return;
      }
    }catch(e){}
  }
  // Dự phòng: lưu trên trình duyệt
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const pr=JSON.parse(raw);S=Object.assign(blankState(),pr);if(pr.areasV===undefined)S.areasV=1;mode="local";maybeMigrate()}}catch(e){}

}

function parseAmount(str){
  let s=str,m;
  m=s.match(/(?:^|\s)(\d{1,3}(?:\.\d{3})+)\s*(?:đ|d|vnd)?(?=\s|$)/i);
  if(m)return{v:+m[1].replace(/\./g,""),raw:m[0]};
  m=s.match(/(?:^|\s)(\d+)\s*(?:tr|triệu)\s*(\d{1,3})(?=\s|$)/i);
  if(m)return{v:+m[1]*1e6+ +m[2]*Math.pow(10,6-m[2].length),raw:m[0]};
  m=s.match(/(?:^|\s)[+-]?(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|m|đ|d)?(?=\s|$)/i);
  if(m){let v=parseFloat(m[1].replace(",","."));const u=(m[2]||"").toLowerCase();
    if(u==="k"||u==="nghìn"||u==="ngàn")v*=1e3;else if(u==="tr"||u==="triệu"||u==="m")v*=1e6;else if(!u||u==="đ"||u==="d"){if(v<1000)v*=1e3}
    return{v:Math.round(v),raw:m[0]}}
  return null;
}
function guessCat(note,type){
  const n=note.toLowerCase();
  if(type==="thu")return /thưởng|bonus/.test(n)?"Thưởng":/lương/.test(n)?"Lương":"Thu khác";
  const R=[["Ăn uống",/ăn|cơm|phở|bún|cafe|cà phê|cf|trà|chợ|siêu thị|bánh|nước|nhậu|lẩu|trưa|tối|sáng/],["Đi lại",/xăng|grab|be |taxi|xe|gửi xe|vé|bus/],["Hóa đơn",/điện|nước|internet|mạng|wifi|điện thoại|gas|nhà/],["Sức khỏe",/thuốc|khám|viện|gym|bảo hiểm/],["Giải trí",/phim|game|netflix|spotify|du lịch|karaoke/],["Gia đình",/bố|mẹ|con|vợ|chồng|em|anh|chị|quà/],["Mua sắm",/mua|áo|quần|giày|shopee|lazada|tiki/]];
  for(const [c,re] of R)if(re.test(n))return c;return "Khác";
}
function parseQuick(text){
  let s=" "+text.trim()+" ";
  const txm=s.match(/^\s(chi|tiêu|thu|nhận|[+-])\s*/i);
  if(txm){
    const head=txm[1].toLowerCase();const type=(head==="thu"||head==="nhận"||head==="+")?"thu":"chi";
    const rest=s.slice(txm[0].length);const a=parseAmount(" "+rest);
    if(a){let note=(" "+rest).replace(a.raw," ");let date=today();
      if(/(^|\s)hôm qua(?=\s|$)/i.test(note)){date=addDays(today(),-1);note=note.replace(/(^|\s)hôm qua(?=\s|$)/i," ")}
      note=note.replace(/\s+/g," ").trim();
      return{kind:"tx",type,amount:a.v,note:note||(type==="thu"?"Khoản thu":"Khoản chi"),cat:guessCat(note,type),date}}
  }
  const r={kind:"task",title:"",due:"",time:"",prio:0,tag:"",repeat:"none"};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(re," ")}};
  take(/\s!+(?=\s)/,()=>r.prio=2);
  take(/\s#([^\s#]+)(?=\s)/,m=>r.tag=m[1]);
  take(/\s(hằng|hàng|mỗi)\s(ngày|tuần|tháng)(?=\s)/i,m=>r.repeat={"ngày":"daily","tuần":"weekly","tháng":"monthly"}[m[2].toLowerCase()]);
  take(/\s(\d{1,2})[:h](\d{2})?(?=\s)/i,m=>{const h=+m[1];if(h<24)r.time=pad(h)+":"+pad(+(m[2]||0))});
  take(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/,m=>{let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&diffDays(ymd(d),today())<-60)d.setFullYear(y+1);r.due=ymd(d)});
  take(/\s(hôm nay|hnay)(?=\s)/i,()=>r.due=today());
  take(/\s(ngày kia|mốt)(?=\s)/i,()=>r.due=addDays(today(),2));
  take(/\s(ngày mai|mai)(?=\s)/i,()=>r.due=addDays(today(),1));
  take(/\stuần sau(?=\s)/i,()=>r.due=addDays(today(),7));
  take(/\s(chủ nhật|cn)(?=\s)/i,()=>r.due=nextWeekday(0));
  take(/\s(?:thứ\s?|t)([2-7])(?=\s)/i,m=>r.due=nextWeekday(+m[1]-1));
  take(/\sthứ\s(hai|ba|tư|tu|năm|nam|sáu|sau|bảy|bay)(?=\s)/i,m=>r.due=nextWeekday(WORDDAY[m[1].toLowerCase()]));
  if(r.repeat!=="none"&&!r.due)r.due=today();
  r.title=s.replace(/\s+/g," ").trim();
  r.title=r.title.charAt(0).toUpperCase()+r.title.slice(1);
  return r;
}

function openTasks(){return S.tasks.filter(t=>!t.done)}
function nextDue(t){if(t.repeat==="daily")return addDays(t.due||today(),1);if(t.repeat==="weekly")return addDays(t.due||today(),7);
  if(t.repeat==="monthly"){const d=parseD(t.due||today());d.setMonth(d.getMonth()+1);return ymd(d)}return t.due}
function completeTask(t){
  if(t.repeat&&t.repeat!=="none"){t.hist=(t.hist||[]).concat(today()).slice(-90);let n=nextDue(t),g=0;while(diffDays(n,today())<=0&&g++<400)n=nextDue({repeat:t.repeat,due:n});t.due=n;toast("Xong! Lần tới: "+dateLabel(n))}
  else{t.done=true;t.doneAt=today()}
}
function monthTx(mk){return S.tx.filter(x=>monthKey(x.date)===mk)}
function sumBy(list,type){return list.filter(x=>x.type===type).reduce((a,x)=>a+x.amount,0)}
function spentByCat(mk){const o={};monthTx(mk).filter(x=>x.type==="chi").forEach(x=>o[x.cat]=(o[x.cat]||0)+x.amount);return o}
function billStatus(b){
  const t=today(),mk=monthKey(t);const paid=(b.paid||[]).includes(mk);
  const td=parseD(t);const last=new Date(td.getFullYear(),td.getMonth()+1,0).getDate();
  const due=ymd(new Date(td.getFullYear(),td.getMonth(),Math.min(b.day,last)));
  return{paid,due,days:diffDays(due,t)};
}
function docStatus(d){if(!d.expiry)return{cls:"",label:"Không thời hạn",days:9999};const n=diffDays(d.expiry,today());
  if(n<0)return{cls:"red",label:"Hết hạn "+(-n)+" ngày",days:n};if(n===0)return{cls:"red",label:"Hết hạn hôm nay",days:0};
  if(n<=30)return{cls:"amber",label:"Còn "+n+" ngày",days:n};return{cls:"ok",label:"Còn hạn · "+dateLabel(d.expiry),days:n}}
function habitVal(h,day){return (h.log&&h.log[day])||0}
function streak(h){let n=0,d=today();if(habitVal(h,d)<h.target)d=addDays(d,-1);while(habitVal(h,d)>=h.target){n++;d=addDays(d,-1)}return n}
function goalPct(g){const st=g.steps||[];if(!st.length)return 0;return Math.round(st.filter(x=>x.done).length/st.length*100)}
function mins(hm){const p=(hm||"0:0").split(":");return +p[0]*60+ +p[1]}
function fastNow(){
  const f=S.fasting,now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const a=mins(f.from),b=mins(f.to);const inWin=a<=b?(cur>=a&&cur<b):(cur>=a||cur<b);
  const winLen=((b-a)+1440)%1440||1440;
  let left,total,elapsed;
  if(inWin){left=((b-cur)+1440)%1440;total=winLen;elapsed=total-left}
  else{left=((a-cur)+1440)%1440;total=1440-winLen;elapsed=total-left}
  return{inWin,left,total,elapsed,fastHours:Math.round((1440-winLen)/60)};
}
const hm=m=>Math.floor(m/60)+" giờ "+pad(m%60)+" phút";

/* ---------- Quỹ dự phòng ---------- */
function autoMonthly(){
  const t=today();let mk=monthKey(t);const vals=[];
  for(let k=0;k<3;k++){mk=prevMonth(mk);const v=sumBy(monthTx(mk),"chi");if(v>0)vals.push(v)}
  const r10=v=>Math.round(v/1e4)*1e4;
  if(vals.length)return r10(vals.reduce((a,b)=>a+b,0)/vals.length);
  const cur=sumBy(monthTx(monthKey(t)),"chi"),d=parseD(t),day=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return r10(cur/day*last);
}
function fundInfo(){const f=S.fund||(S.fund={months:6,monthly:0,balance:0,log:[]});const monthly=+f.monthly||autoMonthly();const target=monthly*f.months;
  return{f,monthly,auto:!(+f.monthly),target,months:f.months,cov:monthly?f.balance/monthly:0,pct:target?Math.min(100,f.balance/target*100):0,miss:Math.max(0,target-f.balance)}}

function moduleArea(mod){
  S.areas=S.areas||[];let a=S.areas.find(x=>x.module===mod);
  if(!a){a=S.areas.find(x=>!x.module&&norm(x.name)===norm(MODULE_AREA[mod]));if(a)a.module=mod}
  if(!a){a={id:"m-"+mod,name:MODULE_AREA[mod],group:MODULE_GROUP[mod],notes:[],module:mod};S.areas.push(a)}
  if(!a.group)a.group=MODULE_GROUP[mod];
  return a;
}
function areaNames(){return S.areas&&S.areas.length?S.areas.map(a=>a.name):AREAS}
function renameRefs(oldName,newName){const o=norm(oldName);
  S.tasks.forEach(t=>{if(norm(t.tag)===o)t.tag=newName});S.goals.forEach(g=>{if(norm(g.area)===o)g.area=newName});(S.habits||[]).forEach(h=>{if(norm(h.area)===o)h.area=newName})}
function migrateAreas(){
  S.areas=S.areas||[];if((S.areasV||1)>=AREAS_V&&S.areas.length&&S.areas.every(a=>a.group))return false;
  const REN={suanha:"Nhà cửa & xe",hoc:"Học tập & phát triển",hoctap:"Học tập & phát triển",chi:"Giá trị & ý chí",ychitinhthan:"Giá trị & ý chí",ychi:"Giá trị & ý chí"};
  S.areas.forEach(a=>{const r=REN[norm(a.name)];if(r){renameRefs(a.name,r);a.name=r}const d=DEF_AREAS.find(x=>norm(x.name)===norm(a.name));if(!a.group)a.group=d?d.group:"life";if(d&&d.module&&!a.module)a.module=d.module});
  DEF_AREAS.forEach(d=>{if(!S.areas.some(a=>norm(a.name)===norm(d.name)))S.areas.push({id:newId(),name:d.name,group:d.group,notes:[],module:d.module})});
  const ix=a=>{const i=DEF_AREAS.findIndex(d=>norm(d.name)===norm(a.name));return i<0?999:i};
  S.areas=S.areas.map((a,i)=>[a,i]).sort((x,y)=>ix(x[0])-ix(y[0])||x[1]-y[1]).map(x=>x[0]);
  S.areasV=AREAS_V;
  return true;
}

function areaInfo(a){
  const k=norm(a.name),t=today();
  const tasks=S.tasks.filter(x=>norm(x.tag)===k),open=tasks.filter(x=>!x.done);
  const overdue=open.filter(x=>x.due&&diffDays(x.due,t)<0).length;
  const goals=S.goals.filter(g=>norm(g.area)===k);
  const gp=goals.length?Math.round(goals.reduce((s,g)=>s+goalPct(g),0)/goals.length):null;
  const habits=(S.habits||[]).filter(h=>norm(h.area)===k);
  const sc=(a.scores||{})[monthKey(t)];
  return{tasks,open,overdue,goals,gp,habits,notes:a.notes||[],score:sc==null?null:sc};
}

function noteBody(a,n,clip){
  const lines=(n.text||"").split("\n");let html="",para=[],done=0,total=0;
  const flush=()=>{if(para.length){html+='<p>'+esc(para.join("\n"))+'</p>';para=[]}};
  lines.forEach((ln,i)=>{const m=ln.match(/^\s*(?:[-*]\s*)?\[( |x|X)\]\s?(.*)$/);
    if(m){flush();const ok=m[1]!==" ";total++;if(ok)done++;html+='<label class="step'+(ok?' done':'')+'"><input type="checkbox" class="check" data-act="note-check" data-area="'+a.id+'" data-id="'+n.id+'" data-i="'+i+'"'+(ok?' checked':'')+'><span>'+esc(m[2])+'</span></label>'}
    else para.push(ln)});

}

function wheelSVG(areas,mk){
  const N=areas.length||1,step=Math.PI*2/N,r0=30,R=116,gap=0.012;
  const P=(r,a)=>(r*Math.cos(a)).toFixed(1)+" "+(r*Math.sin(a)).toFixed(1);
  const wedge=(r,s,e)=>'M'+P(r0,s)+'L'+P(r,s)+'A'+r+' '+r+' 0 0 1 '+P(r,e)+'L'+P(r0,e)+'A'+r0+' '+r0+' 0 0 0 '+P(r0,s)+'Z';
  let out="",rated=0,sum=0;
  areas.forEach((a,i)=>{const s=-Math.PI/2+i*step+gap,e=-Math.PI/2+(i+1)*step-gap,m=(s+e)/2;const v=(a.scores||{})[mk];

function srcLinks(keys){return keys.map(k=>{const s=SRC[k];return s?'<a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+' ↗</a>':''}).join(" · ")}
function adviceList(items){return '<ul class="adv">'+items.map(x=>'<li><span>'+esc(x.t)+'</span>'+(x.s.length?'<span class="src">Nguồn: '+srcLinks(x.s)+'</span>':'')+'</li>').join("")+'</ul>'}
function adviceFor(a){const k=norm(a.name);const key=Object.keys(ADVICE).find(n=>norm(n)===k);return key?ADVICE[key]:null}
function coverageCard(){
  const has=n=>S.areas.some(a=>norm(a.name)===norm(n));
  let miss=0;
  const rows=COVER.map(r=>{const got=r.a.filter(has);const ok=got.length>0||(!r.a.length&&r.feat);if(!ok)miss++;
    const cnt=r.f.filter(v=>v>0).length;
    return '<div class="cv"><span class="cvd">'+esc(r.d)+'</span><span class="cvf" title="Có trong '+cnt+'/7 khung">'+r.f.map(v=>'<i class="'+(v===1?'f':v?'p':'z')+'"></i>').join("")+'</span><span class="cva">'+(ok?got.map(n=>{const a=S.areas.find(x=>norm(x.name)===norm(n));return '<button class="chip ok" data-act="area-open" data-id="'+a.id+'">'+esc(a.name)+'</button>'}).join("")+(r.feat?'<span class="chip">'+esc(r.feat)+'</span>':''):'<button class="chip red" data-act="cover-add" data-v="'+esc(r.a[0])+'" data-g="'+r.g+'">+ Thêm '+esc(r.a[0])+'</button>')+'</span></div>'}).join("");
  return '<details class="card cover" open><summary><span>Bản đồ phủ lĩnh vực</span><span class="chip '+(miss?'red':'ok')+'">'+(COVER.length-miss)+'/'+COVER.length+' mặt đã phủ</span></summary>'
   +'<p class="muted" style="margin:0">Đối chiếu với 7 bộ khung nghiên cứu về chất lượng sống. Mỗi chấm là một khung: đặc = có, rỗng = có một phần.</p>'
   +'<div class="cvh"><span>Mặt của cuộc sống</span><span class="cvf">'+FW.map(f=>'<abbr title="'+esc(f[0])+'">'+esc(f[0].slice(0,2))+'</abbr>').join("")+'</span><span>Trong app</span></div>'
   +rows+'<p class="muted" style="margin:4px 0 0">Khung: '+srcLinks(FW.map(f=>f[1]))+'</p></details>';
}

function vAreas(){
  moduleArea("money");moduleArea("habits");
  const a=ui.areaTab&&find(S.areas,ui.areaTab);
  return a?areaDetail(a):areaOverview();
}
function areaRow(a,i,mk,mo){
  const bits=[];
  if(a.module==="money"){const sp=sumBy(monthTx(mk),"chi"),fm=fundInfo();bits.push('<b class="out">chi '+vndShort(sp)+'</b>','quỹ '+fm.cov.toFixed(1)+'/'+fm.months+' th')}
  else if(a.module==="habits"){const t=today(),hs=S.habits||[];bits.push('thói quen '+hs.filter(h=>habitVal(h,t)>=h.target).length+'/'+hs.length);const na=nextAppts()[0],mi=activeMeds().length;if(na)bits.push('tái khám '+dateLabel(na.next).toLowerCase());if(mi)bits.push(mi+' thuốc')}
  if(i.open.length)bits.push(i.overdue?'<b class="red">'+i.open.length+' việc · '+i.overdue+' trễ</b>':i.open.length+' việc');
  if(i.notes.length)bits.push(i.notes.length+' ghi chú');
  if(i.goals.length)bits.push('mục tiêu '+i.gp+'%');
  if(!a.module){const sp=areaSpend(a,mk);if(sp)bits.push('chi '+vndShort(sp))}
  return '<button class="arow g-'+(a.group||"life")+'" data-act="area-open" data-id="'+a.id+'">'+aIcon(a,"sm")+'<span class="ar-m"><span class="ar-n">'+esc(a.name)+'</span><span class="ar-b">'+(bits.length?bits.join(" · "):'<span class="ar-e">Trống</span>')+'</span></span><span class="score '+scoreCls(i.score)+' num">'+(i.score==null?'–':i.score)+'</span></button>';
}

function searchResults(q){
  q=norm(q);if(!q||q.length<2)return "";
  const res=[];
  S.areas.forEach(a=>(a.notes||[]).forEach(n=>{if(norm(n.title+" "+n.text).includes(q))res.push('<button class="sr" data-act="area-open" data-id="'+a.id+'" data-sub="notes"><span class="chip">Ghi chú</span><span>'+esc(n.title)+'</span><span class="muted">'+esc(a.name)+'</span></button>')}));
  S.tasks.forEach(t=>{if(norm(t.title).includes(q)){const a=S.areas.find(x=>norm(x.name)===norm(t.tag));res.push('<button class="sr" data-act="'+(a?'area-open':'goto-tasks')+'"'+(a?' data-id="'+a.id+'" data-sub="tasks"':'')+'><span class="chip'+(t.done?' ok':'')+'">'+(t.done?'Đã xong':'Việc')+'</span><span>'+esc(t.title)+'</span><span class="muted">'+esc(a?a.name:"Việc cần làm")+'</span></button>')}});
  S.goals.forEach(g=>{if(norm(g.title).includes(q)){const a=S.areas.find(x=>norm(x.name)===norm(g.area));res.push('<button class="sr" data-act="'+(a?'area-open':'goto-goals')+'"'+(a?' data-id="'+a.id+'" data-sub="goals"':'')+'><span class="chip jade">Mục tiêu</span><span>'+esc(g.title)+'</span><span class="muted">'+esc(g.area||"")+'</span></button>')}});
  return res.length?'<div class="srl">'+res.slice(0,20).join("")+'</div>':'<p class="empty">Không tìm thấy.</p>';
}
function scoreSpark(a){
  const mk=monthKey(today()),ks=[];let k=mk;for(let n=0;n<6;n++){ks.unshift(k);k=prevMonth(k)}
  const sc=a.scores||{},pts=ks.map((m,i)=>[i,sc[m]]).filter(p=>p[1]!=null);

/* ---------- Review tuần ---------- */
function vReview(){
  const end=addDays(today(),-7*ui.reviewOffset),days=[];for(let i=6;i>=0;i--)days.push(addDays(end,-i));
  const inR=d=>d&&d>=days[0]&&d<=days[6];
  let done=S.tasks.filter(t=>t.done&&inR(t.doneAt)).length;S.tasks.forEach(t=>(t.hist||[]).forEach(h=>{if(inR(h))done++}));
  const added=S.tasks.filter(t=>!t.done&&t.due&&inR(t.due)&&diffDays(t.due,today())<0).length;
  const daySpend=days.map(d=>sumBy(S.tx.filter(x=>x.date===d),"chi"));const total=daySpend.reduce((a,b)=>a+b,0);const max=Math.max(1,...daySpend);
  let hDone=0,hAll=0;S.habits.forEach(h=>days.forEach(d=>{hAll++;if(habitVal(h,d)>=h.target)hDone++}));
  const hp=hAll?Math.round(hDone/hAll*100):0;
  const moods=days.map(d=>S.journal[d]&&S.journal[d].mood).filter(x=>x!=null);
  const avgMood=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:null;
  const fastKept=days.filter(d=>(S.fasting.log||[]).includes(d)).length;
  const by={};S.tx.filter(x=>x.type==="chi"&&inR(x.date)).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const lbl=parseD(days[0]).getDate()+"/"+(parseD(days[0]).getMonth()+1)+" – "+parseD(days[6]).getDate()+"/"+(parseD(days[6]).getMonth()+1);
  const nav='<div class="row" style="align-items:center"><button class="icon-btn" data-act="r-prev" aria-label="Tuần trước">'+icon("left")+'</button><span class="num" style="font-weight:600;min-width:110px;text-align:center">'+lbl+'</span><button class="icon-btn" data-act="r-next" aria-label="Tuần sau"'+(ui.reviewOffset===0?' disabled style="opacity:.3"':'')+'>'+icon("right")+'</button></div>';
  return head("Review tuần",ui.reviewOffset===0?"7 ngày vừa qua":"Tuần "+lbl,"",nav)
  +'<div class="card"><div class="stats"><div class="stat"><span class="k">Việc đã xong</span><span class="v">'+done+'</span></div><div class="stat"><span class="k">Đã chi</span><span class="v out">'+vndShort(total)+'</span></div><div class="stat"><span class="k">Thói quen đạt</span><span class="v">'+hp+'%</span></div><div class="stat"><span class="k">Giữ 16:8</span><span class="v">'+fastKept+'/7</span></div><div class="stat"><span class="k">Tâm trạng TB</span><span class="v">'+(avgMood==null?"—":MOODS[Math.round(avgMood)])+'</span></div></div></div>'
  +'<div class="grid gfill"><div class="card"><h2>Chi tiêu theo ngày</h2><div class="chart">'+days.map((d,i)=>'<div class="col"><span class="val">'+(daySpend[i]?vndShort(daySpend[i]):"")+'</span><div class="b" style="height:'+(daySpend[i]/max*100*0.78).toFixed(1)+'%"></div><span class="lbl">'+WD[parseD(d).getDay()]+'</span></div>').join("")+'</div>'+(top.length?'<p class="muted" style="margin:0">Chi nhiều nhất: '+top.map(([c,v])=>esc(c)+' '+vndShort(v)).join(" · ")+'</p>':'')+'</div>'
  +'<div class="card"><h2>Thói quen trong tuần</h2>'+(S.habits.length?S.habits.map(h=>{const k=days.filter(d=>habitVal(h,d)>=h.target).length;return '<div class="budget"><div class="l"><span>'+esc(h.name)+'</span><span>'+k+'/7 ngày</span></div><div class="bar'+(k<3?' warn':'')+'"><span style="width:'+(k/7*100)+'%"></span></div></div>'}).join(""):'<p class="empty">Chưa có thói quen.</p>')+'</div>'
  +'<div class="card"><h2>Ghi chú cho tuần sau</h2><p class="muted" style="margin:0">'+(added?'Có '+added+' việc bị trễ hạn trong tuần — cân nhắc dời ngày hoặc chia nhỏ.':'Không có việc nào bị trễ hạn trong tuần.')+(hp<50&&S.habits.length?' Tỉ lệ thói quen dưới 50%, thử giảm số thói quen xuống còn 2–3 cái quan trọng nhất.':'')+'</p></div></div>';
}

/* ---------- Sự kiện ---------- */
const find=(arr,id)=>arr.find(x=>x.id===id);
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");if(nav){e.preventDefault();go(nav.dataset.nav);return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="close-sheet"){if(e.target===el||el.tagName==="BUTTON")closeSheet();return}
  if(a==="rec-close"){if(e.target===el||el.tagName==="BUTTON"){discardPending();closeSheet()}return}
  switch(a){
   case "quick":openQuick();break;
   case "more":openMore();break;
   case "start-sample":startFresh(true);break;
   case "start-blank":startFresh(false);break;
   case "task-toggle":{const t=find(S.tasks,id);if(!t)return;if(t.done){t.done=false;t.doneAt=null}else completeTask(t);persist("tasks");render();break}
   case "task-edit":ui.editTask=ui.editTask===id?null:id;if(view!=="tasks"){view="tasks"}render();setTimeout(()=>{const i=$("#et-title");if(i)i.focus()},30);break;
   case "task-del":if(!confirmArm(el))return;S.tasks=S.tasks.filter(t=>t.id!==id);persist("tasks");render();break;
   case "task-tab":ui.taskTab=el.dataset.v;ui.editTask=null;render();break;
   case "clear-done":if(!confirmArm(el))return;S.tasks=S.tasks.filter(t=>!t.done);persist("tasks");render();break;
   case "m-prev":case "m-next":{const d=parseD(ui.moneyMonth+"-01");d.setMonth(d.getMonth()+(a==="m-prev"?-1:1));ui.moneyMonth=monthKey(ymd(d));render();break}
   case "tx-type":ui.txType=el.dataset.v;render();break;
   case "tx-del":if(!confirmArm(el))return;S.tx=S.tx.filter(x=>x.id!==id);persist("money");render();break;
   case "budget-edit":ui.editBudget=!ui.editBudget;render();break;
   case "bill-pay":{const b=find(S.bills,id);if(!b)return;const mk=monthKey(today());b.paid=(b.paid||[]).filter(m=>m>=monthKey(addDays(today(),-370))).concat(mk);S.tx.push({id:newId(),type:"chi",amount:b.amount,cat:"Hóa đơn",note:b.name,date:today()});persist("money");toast("Đã ghi "+vnd(b.amount)+" cho "+b.name);render();break}
   case "bill-del":if(!confirmArm(el))return;S.bills=S.bills.filter(x=>x.id!==id);persist("money");render();break;
   case "habit-inc":{const h=find(S.habits,id);if(!h)return;h.log=h.log||{};const t=today(),v=h.log[t]||0;h.log[t]=h.target===1?(v?0:1):Math.min(h.target,v+1);if(!h.log[t])delete h.log[t];pruneLog(h);persist("habits");render();break}
   case "habit-dec":{const h=find(S.habits,id);if(!h)return;const t=today();h.log[t]=Math.max(0,(h.log[t]||0)-1);if(!h.log[t])delete h.log[t];persist("habits");render();break}
   case "habit-del":if(!confirmArm(el))return;S.habits=S.habits.filter(x=>x.id!==id);persist("habits");render();break;
   case "fast-log":{const t=today(),l=S.fasting.log||[];S.fasting.log=l.includes(t)?l.filter(x=>x!==t):l.concat(t).filter(d=>diffDays(d,t)>-370);persist("habits");render();break}
   case "area-open":closeSheet();ui.areaTab=el.dataset.id||null;ui.hDept=null;ui.areaSub=el.dataset.sub==="notes"||el.dataset.sub==="tasks"||el.dataset.sub==="goals"?"main":(el.dataset.sub||null);ui.editNote=null;ui.noteForm=false;ui.goalForm=false;ui.rate=false;ui.areaSettings=false;if(view!=="areas")view="areas";render();window.scrollTo(0,0);break;
   case "area-sub":ui.areaSub=el.dataset.v;ui.editNote=null;render();break;

  if(e.key==="Escape"&&$("#overlay").innerHTML){if($('#overlay [data-form="rec-save"]'))discardPending();closeSheet();return}
  const tg=e.target;if(/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;
  if(e.key==="/"&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openQuick()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="ar-search"){ui.areaSearch=t.value;const r=$("#ar-results");if(r)r.innerHTML=searchResults(t.value)}
  if(t.dataset&&t.dataset.rateOut){const o=document.getElementById(t.dataset.rateOut);if(o)o.textContent=t.value}
});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.goal&&e.target.open)ui.openGoal=e.target.dataset.goal;if(e.target.classList&&e.target.classList.contains("adv-sec"))ui.advOpen=e.target.open;if(e.target.classList&&e.target.classList.contains("settings"))ui.areaSettings=e.target.open},true);
window.addEventListener("hashchange",()=>{readHash();render()});

/* ---------- Sao lưu ---------- */
async function doExport(){
  const name="nhip-song-"+today()+".json",text=JSON.stringify(S,null,1);
  const file=new File([new Blob([text],{type:"application/json"})],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sao lưu Nhịp Sống"});toast("Đã sao lưu");return}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(!downloads)return;
  try{await downloads.save({filename:name,data:text});toast("Đã lưu file sao lưu")}
  catch(e){if(e&&e.code!=="declined")toast("Không tạo được file sao lưu")}
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tasks))throw 0;S=Object.assign(blankState(),d);persistAll();if(mode==="local")persist("tasks");toast("Đã khôi phục dữ liệu");render()}catch(e){toast("File không đúng định dạng sao lưu của Nhịp Sống")}};
  r.readAsText(file);
}

init();
})();
</script>
