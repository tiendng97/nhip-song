<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhịp Sống</title>
<meta name="description" content="Sổ quản lý cuộc sống: việc, tiền, sức khỏe, thói quen, mục tiêu">
<meta name="theme-color" content="#1D6A56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nhịp Sống">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shim.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: sổ tay hai cột — thanh điều hướng trái trên máy tính, thanh tab dưới trên điện thoại; nội dung là các thẻ xếp lưới tự co giãn */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#16221E; --ink-2:#4D5E58; --ink-3:#7A8A84;
  --line:#D6E0DB; --jade:#1D6A56; --jade-soft:#D6EBE2; --on-jade:#FFFFFF;
  --amber:#A86F14; --amber-soft:#F5E6CA; --red:#B2433A; --red-soft:#F6DEDA; --ok:#2C7A4C; --ok-soft:#DAEFE1;
  --shadow:0 1px 2px rgba(22,34,30,.06),0 4px 14px rgba(22,34,30,.05);
  --g-self:#1D6A56; --g-self-s:#D6EBE2; --g-rel:#B03A5E; --g-rel-s:#F8DDE5; --g-work:#9A600C; --g-work-s:#F6E7CB; --g-life:#2C5AA0; --g-life-s:#DCE6F6;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-size:24px;font-weight:600;padding:4px 12px 2px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.side .sync{margin:2px 12px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:9px;text-align:left;color:var(--ink-2);font-weight:500}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--jade-soft);color:var(--jade)}
.side .spacer{flex:1}
.tools-row{display:flex;flex-direction:column;gap:2px}
.nav-gh{border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:8px}
.nav-gh:hover{background:var(--surface-2)}
.nav-gh span:nth-child(2){flex:1}
.nav-gh .chev{font-size:10px;color:var(--ink-3)}
.nav-icons{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 4px}
.nav-ic{border:0;background:none;padding:2px;border-radius:9px}
.nav-ic:hover,.nav-ic[aria-current="page"]{background:var(--gs)}
.nav-ic .aicon.sm{width:30px;height:30px}
.side .quick-btn{margin:8px 4px 0}

main{padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.sub{color:var(--ink-2);margin:4px 0 0}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .link{font-size:13px;font-weight:500;color:var(--jade);background:none;border:0;padding:0}
.span2{grid-column:1/-1}
.muted{color:var(--ink-3);font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.icon-btn{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:7px;display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.confirm{color:var(--red);background:var(--red-soft)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 140px}
.form{display:flex;flex-direction:column;gap:10px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.jade{background:var(--jade-soft);color:var(--jade)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--ok)}
.sync.local i{background:var(--amber)}

/* Banner mẫu */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);color:var(--ink);padding:14px 16px;border-radius:var(--r)}
.banner p{margin:0;max-width:60ch}
.banner strong{color:var(--amber)}
.banner .row{align-items:center}

/* Danh sách việc */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item.done .t{color:var(--ink-3);text-decoration:line-through}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.item .acts{display:flex;gap:2px;align-items:center}
.check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin:2px 0 0;display:grid;place-content:center;background:var(--surface);cursor:pointer}
.check::after{content:"";width:10px;height:6px;border:2px solid var(--on-jade);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check:checked{background:var(--jade);border-color:var(--jade)}
.check:checked::after{opacity:1}
.prio-2 .check{border-color:var(--red)}
.prio-1 .check{border-color:var(--amber)}
.group-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 2px;display:flex;gap:6px;align-items:center}
.group-h.red{color:var(--red)}
.ck-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0}
.ck-wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-2);min-width:0}
.ck-wd .dn{font-size:15px;font-weight:600;color:var(--ink)}
.ck-wd .wp{font-size:11px;font-weight:600}
.ck-wd .wbar{width:100%;height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.ck-wd .wbar span{display:block;height:100%;background:var(--jade)}
.ck-wd.cur{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.ck-wd.now .dn::after{content:"•";color:var(--jade);margin-left:2px}
.ck-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ck-nav input[type=date]{flex:1;min-width:150px}
.ck-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ck-big .pct{font-size:34px;font-weight:700;color:var(--jade);line-height:1}
.ck-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.ck-tile{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2)}
.ck-tile b{font-size:18px;color:var(--ink)}
.ck-tile.red b{color:var(--red)}
.ck-tile.ok b{color:var(--ok)}
.ck-groups{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ck-gline{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ck-gline .row1{display:flex;justify-content:space-between;gap:8px}
.ck-item{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.ck-item.iss{border-left:3px solid var(--amber);padding-left:8px}
.ck-item.late .ck-name{color:var(--red)}
.ck-item.done .ck-name{color:var(--ink-3);text-decoration:line-through}
.ck-row{display:flex;gap:10px;align-items:flex-start}
.ck-box{border:0;background:none;font-size:22px;line-height:1;padding:2px;flex:none}
.ck-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ck-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ck-note{font-size:13px;color:var(--ink-2)}
.ck-iss{font-size:13px;color:var(--red)}
.ck-edit-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;flex:none;color:var(--ink-2)}
.ck-tpl{border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.ck-tpl-top{display:flex;gap:8px;align-items:flex-start}
.ck-tpl-acts{display:flex;gap:4px;flex:none}
.ck-tpl-acts button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--ink-2)}
.ck-days{display:flex;flex-wrap:wrap;gap:6px}
.ck-day{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer}
.ck-day input{accent-color:var(--jade)}
[hidden]{display:none!important}
.gacts{margin-left:auto;display:inline-flex;gap:4px}
.gacts button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--ink-2);font-size:12px}
.gacts button:disabled{opacity:.35}
.ck-start{margin-top:4px;align-self:flex-start;border:1px solid var(--jade);background:var(--surface);color:var(--jade);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.ck-start.on{background:var(--jade-soft)}
.ck-bars{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ck-bars .lbl{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.ck-brow{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:2px 8px;font-size:13px;align-items:center}
.ck-brow .bar{grid-column:1/-1}
.ck-tabs{margin-bottom:12px;flex-wrap:wrap}
.ck-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ck-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:13px}
.ck-chip.on{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.ck-range-in{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ck-range-in label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-3);gap:2px;flex:1;min-width:130px}
.ck-range-in input{width:100%}
.ck-dayrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;text-align:left;font-size:13px;color:var(--ink)}
.ck-dayrow .bar{width:90px}
.ck-top{display:flex;flex-direction:column;gap:8px}
.ck-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ck-wd{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink-2);min-width:0}
.ck-wd .dn{font-size:14px;font-weight:600;color:var(--ink)}
.ck-wd .wp{font-size:11px;font-weight:600}
.ck-wd.cur{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.ck-wd.now .dn::after{content:"•";color:var(--jade);margin-left:2px}
.ck-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ck-pct{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.ck-pct .pct{font-size:26px;font-weight:700;color:var(--jade);min-width:64px;line-height:1}
.ck-pct .bar{flex:1}
.ck-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.red{background:var(--red-soft);color:var(--red)}
.seg button{white-space:nowrap}
.head .seg{display:inline-flex;grid-template-columns:none;margin-left:auto;flex:none}
.head .seg button{padding:6px 12px;white-space:nowrap}
.ck-grp{margin-top:8px}
.ck-grp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;margin:0}
.ck-grp>summary::-webkit-details-marker{display:none}
.ck-grp>summary .bar.mini{width:70px;height:6px;margin-left:auto}
.ck-item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ck-row{display:flex;gap:12px;align-items:center}
.ck-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;padding:0;display:grid;place-items:center;color:var(--on-jade);font-size:14px;font-weight:700;line-height:1}
.ck-check.on{background:var(--jade);border-color:var(--jade)}
.ck-check.on::after{content:"✓"}
.ck-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ck-line1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ck-role{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ck-line2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ck-line2 .chip{font-size:12px}
.ck-note{font-size:13px;color:var(--ink-2)}
.ck-acts{display:flex;gap:6px;align-items:center;flex:none}
.ck-go{min-width:34px;height:34px;padding:0 8px;border-radius:999px;border:1px solid var(--jade);background:var(--surface);color:var(--jade);font-size:12px;font-weight:700}
.ck-go.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.ck-item.done .ck-name{color:var(--ink-3);text-decoration:line-through;font-weight:500}
.ck-item.late .ck-name{color:var(--red)}
.ck-item.iss{border-left:3px solid var(--amber);padding-left:8px}
.ck-edit-btn{width:34px;height:34px;border:0;background:none;color:var(--ink-3);font-size:16px;flex:none}
.ck-card{padding:14px}
.ck-nav2{display:flex;align-items:center;gap:8px}
.ck-arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink-2);flex:none;padding:0}
.ck-date{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.2;cursor:pointer;min-width:0}
.ck-date b{font-size:17px}
.ck-date small{font-size:12px;color:var(--ink-3)}
.ck-date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ck-today{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--jade);background:var(--jade);color:var(--on-jade);font-size:13px;font-weight:600;flex:none}
.ck-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0 10px}

/* Ảnh cho Claude đọc qua Google Drive: đổi sang JPG (HEIC của iPhone thì Drive connector không đọc được), đặt tên chung một mã để Claude tìm. */
async function toJpeg(f,name){
  if(f.type==="application/pdf")return new File([f],name+".pdf",{type:"application/pdf"});
  try{const bm=await createImageBitmap(f),k=Math.min(1,2400/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));if(b)return new File([b],name+".jpg",{type:"image/jpeg"})}catch(e){}
  return null;
}
async function aiDrivePrepare(list){
  const st=$("#ai-drive-st");if(st)st.textContent="Đang đổi sang JPG…";
  const batch="NS-"+today().replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6);
  const out=[];let bad=0;
  for(let i=0;i<list.length;i++){const f=await toJpeg(list[i],batch+"-"+String(i+1).padStart(2,"0"));if(f)out.push(f);else bad++}
  ui.aiDrive={batch,files:out};
  if(st)st.textContent=out.length?"Đã chọn "+out.length+" ảnh"+(bad?" ("+bad+" ảnh không đổi được)":""):"Không đổi được ảnh nào sang JPG";
}

const REC_SCHEMA=(()=>{const S_=()=>({type:"string"});const obj=(keys)=>({type:"object",properties:Object.fromEntries(keys.map(k=>[k,S_()])),required:keys,additionalProperties:false});
  const item=obj(["date","dept","title","place","doctor","diagnosis","next","nextTime","notes","issue","albumName","album"]);
  item.properties.files={type:"array",items:{type:"string"}};
  item.properties.labs={type:"array",items:obj(["name","value","unit","lo","hi"])};
  const medS=obj(["name","dose","how","days"]);medS.properties.src={type:"string",enum:["don","mua"]};medS.properties.phases={type:"array",items:obj(["days","dose","how"])};medS.required.push("phases");const infoS=obj(["what","group","step","meal","role","usage","warnings","summary","sourceDoc","album"]);infoS.properties.evidence={type:"array",items:obj(["point","source","url"])};infoS.required.push("evidence");medS.properties.info=infoS;medS.required.push("info");item.properties.meds={type:"array",items:medS};
  item.properties.items={type:"array",items:{type:"object",properties:{kind:{type:"string",enum:["img","other"]},title:{type:"string"},qty:{type:"string"},price:{type:"string"},amount:{type:"string"},detail:{type:"string"},info:infoS},required:["kind","title","qty","price","amount","detail","info"],additionalProperties:false}};
  item.required=item.required.concat(["files","labs","meds","items"]);
  ["costTotal","costDiscount","costPaid","payMethod","receiptNo"].forEach(k=>{item.properties[k]=S_();item.required.push(k)});
  return {type:"object",properties:{records:{type:"array",items:item}},required:["records"],additionalProperties:false}})();

let assetsApi=null;
const OK_TYPES=["image/png","image/jpeg","image/gif","image/webp","application/pdf"];
async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5e6||typeof createImageBitmap!=="function")return f;
  try{const bm=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b&&b.size<f.size?b:f}catch(e){return f}
}
async function uploadInto(input){
  const target=document.getElementById(input.dataset.up);const st=input.parentElement.querySelector(".up-st");
  const files=[...input.files];input.value="";
  for(const f of files){
    if(!OK_TYPES.includes(f.type)){toast("Chỉ nhận ảnh JPG, PNG, WEBP, GIF hoặc PDF");continue}
    if(st)st.textContent="Đang tải "+f.name+"…";
    try{const blob=await shrink(f);const res=await assetsApi.upload(blob,{type:blob.type||f.type});const rec={id:res.id,name:f.name,type:res.contentType};
      const pool=input.dataset.pool||"pending";(ui[pool]=ui[pool]||[]).push(res.id);
      let wrap=target.querySelector(".thumbs");if(!wrap){target.insertAdjacentHTML("beforeend",'<div class="thumbs"></div>');wrap=target.querySelector(".thumbs")}
      const tmp=document.createElement("div");tmp.innerHTML=thumbs([rec],true);wrap.appendChild(tmp.querySelector(".tw"));
    }catch(e){const c=e&&e.code;toast(c==="too_large"?"Tệp quá lớn (tối đa 20 MB)":c==="unsupported_type"?"Định dạng tệp không được hỗ trợ":c==="quota_or_state"?"Bộ nhớ ảnh đã đầy — xoá bớt tệp cũ":"Chưa tải được "+f.name)}
  }
  if(st)st.textContent="";
}

  pid=pid||ui.person;

  syncCache(pid,mod);
  if(mode==="local"){saveLocal();return}
  const key=pid+"|"+mod;dirty[key]=true;clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>flush(pid,mod),500);
}
async function flush(pid,mod){
  const key=pid+"|"+mod;
  if(inflight[key]){timers[key]=setTimeout(()=>flush(pid,mod),300);return}
  if(!dirty[key])return;
  dirty[key]=false;inflight[key]=true;setSync("saving");
  try{await docRef(mod,pid).set(Object.assign({v:1},pickFrom(cacheOf(pid),mod)))}
  catch(e){
    if(e&&e.code==="unavailable"){dirty[key]=true;setTimeout(()=>flush(pid,mod),1500+Math.random()*1000)}
    else toast(e&&e.code==="quota_exceeded"?"Bộ nhớ đã đầy — xoá bớt giao dịch cũ rồi thử lại":"Chưa lưu được ("+(e&&e.code||"lỗi")+")");
  }finally{inflight[key]=false;setSync(Object.values(dirty).some(Boolean)?"saving":"on")}
}

/* ---------- Bộ phân tích "Ghi nhanh" ---------- */
const WORDDAY={"hai":1,"ba":2,"tư":3,"tu":3,"năm":4,"nam":4,"sáu":5,"sau":5,"bảy":6,"bay":6};
function nextWeekday(wd){const d=new Date();const diff=(wd-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return ymd(d)}
function parseAmount(str){
  let s=str,m;
  m=s.match(/(?:^|\s)(\d{1,3}(?:\.\d{3})+)\s*(?:đ|d|vnd)?(?=\s|$)/i);
  if(m)return{v:+m[1].replace(/\./g,""),raw:m[0]};
  m=s.match(/(?:^|\s)(\d+)\s*(?:tr|triệu)\s*(\d{1,3})(?=\s|$)/i);
  if(m)return{v:+m[1]*1e6+ +m[2]*Math.pow(10,6-m[2].length),raw:m[0]};
  m=s.match(/(?:^|\s)[+-]?(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|m|đ|d)?(?=\s|$)/i);
  if(m){let v=parseFloat(m[1].replace(",","."));const u=(m[2]||"").toLowerCase();
    if(u==="k"||u==="nghìn"||u==="ngàn")v*=1e3;else if(u==="tr"||u==="triệu"||u==="m")v*=1e6;else if(!u||u==="đ"||u==="d"){if(v<1000)v*=1e3}
    return{v:Math.round(v),raw:m[0]}}
  return null;
}
function guessCat(note,type){
  const n=note.toLowerCase();
  if(type==="thu")return /thưởng|bonus/.test(n)?"Thưởng":/lương/.test(n)?"Lương":"Thu khác";
  const R=[["Ăn uống",/ăn|cơm|phở|bún|cafe|cà phê|cf|trà|chợ|siêu thị|bánh|nước|nhậu|lẩu|trưa|tối|sáng/],["Đi lại",/xăng|grab|be |taxi|xe|gửi xe|vé|bus/],["Hóa đơn",/điện|nước|internet|mạng|wifi|điện thoại|gas|nhà/],["Sức khỏe",/thuốc|khám|viện|gym|bảo hiểm/],["Giải trí",/phim|game|netflix|spotify|du lịch|karaoke/],["Gia đình",/bố|mẹ|con|vợ|chồng|em|anh|chị|quà/],["Mua sắm",/mua|áo|quần|giày|shopee|lazada|tiki/]];
  for(const [c,re] of R)if(re.test(n))return c;return "Khác";
}
function parseQuick(text){
  let s=" "+text.trim()+" ";
  const txm=s.match(/^\s(chi|tiêu|thu|nhận|[+-])\s*/i);
  if(txm){
    const head=txm[1].toLowerCase();const type=(head==="thu"||head==="nhận"||head==="+")?"thu":"chi";
    const rest=s.slice(txm[0].length);const a=parseAmount(" "+rest);
    if(a){let note=(" "+rest).replace(a.raw," ");let date=today();
      if(/(^|\s)hôm qua(?=\s|$)/i.test(note)){date=addDays(today(),-1);note=note.replace(/(^|\s)hôm qua(?=\s|$)/i," ")}
      note=note.replace(/\s+/g," ").trim();
      return{kind:"tx",type,amount:a.v,note:note||(type==="thu"?"Khoản thu":"Khoản chi"),cat:guessCat(note,type),date}}
  }
  const r={kind:"task",title:"",due:"",time:"",prio:0,tag:"",repeat:"none"};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(re," ")}};
  take(/\s!+(?=\s)/,()=>r.prio=2);
  take(/\s#([^\s#]+)(?=\s)/,m=>r.tag=m[1]);
  take(/\s(hằng|hàng|mỗi)\s(ngày|tuần|tháng)(?=\s)/i,m=>r.repeat={"ngày":"daily","tuần":"weekly","tháng":"monthly"}[m[2].toLowerCase()]);
  take(/\s(\d{1,2})[:h](\d{2})?(?=\s)/i,m=>{const h=+m[1];if(h<24)r.time=pad(h)+":"+pad(+(m[2]||0))});
  take(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/,m=>{let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&diffDays(ymd(d),today())<-60)d.setFullYear(y+1);r.due=ymd(d)});
  take(/\s(hôm nay|hnay)(?=\s)/i,()=>r.due=today());
  take(/\s(ngày kia|mốt)(?=\s)/i,()=>r.due=addDays(today(),2));
  take(/\s(ngày mai|mai)(?=\s)/i,()=>r.due=addDays(today(),1));
  take(/\stuần sau(?=\s)/i,()=>r.due=addDays(today(),7));
  take(/\s(chủ nhật|cn)(?=\s)/i,()=>r.due=nextWeekday(0));
  take(/\s(?:thứ\s?|t)([2-7])(?=\s)/i,m=>r.due=nextWeekday(+m[1]-1));
  take(/\sthứ\s(hai|ba|tư|tu|năm|nam|sáu|sau|bảy|bay)(?=\s)/i,m=>r.due=nextWeekday(WORDDAY[m[1].toLowerCase()]));
  if(r.repeat!=="none"&&!r.due)r.due=today();
  r.title=s.replace(/\s+/g," ").trim();
  r.title=r.title.charAt(0).toUpperCase()+r.title.slice(1);
  return r;
}

function nextDue(t){if(t.repeat==="daily")return addDays(t.due||today(),1);if(t.repeat==="weekly")return addDays(t.due||today(),7);
  if(t.repeat==="monthly"){const d=parseD(t.due||today());d.setMonth(d.getMonth()+1);return ymd(d)}return t.due}

  const td=parseD(t);const last=new Date(td.getFullYear(),td.getMonth()+1,0).getDate();

function docStatus(d){if(!d.expiry)return{cls:"",label:"Không thời hạn",days:9999};const n=diffDays(d.expiry,today());
  if(n<0)return{cls:"red",label:"Hết hạn "+(-n)+" ngày",days:n};if(n===0)return{cls:"red",label:"Hết hạn hôm nay",days:0};
  if(n<=30)return{cls:"amber",label:"Còn "+n+" ngày",days:n};return{cls:"ok",label:"Còn hạn · "+dateLabel(d.expiry),days:n}}
function habitVal(h,day){return (h.log&&h.log[day])||0}
function streak(h){let n=0,d=today();if(habitVal(h,d)<h.target)d=addDays(d,-1);while(habitVal(h,d)>=h.target){n++;d=addDays(d,-1)}return n}
function goalPct(g){const st=g.steps||[];if(!st.length)return 0;return Math.round(st.filter(x=>x.done).length/st.length*100)}
function mins(hm){const p=(hm||"0:0").split(":");return +p[0]*60+ +p[1]}
function fastNow(){
  const f=S.fasting,now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const a=mins(f.from),b=mins(f.to);const inWin=a<=b?(cur>=a&&cur<b):(cur>=a||cur<b);
  const winLen=((b-a)+1440)%1440||1440;
  let left,total,elapsed;
  if(inWin){left=((b-cur)+1440)%1440;total=winLen;elapsed=total-left}
  else{left=((a-cur)+1440)%1440;total=1440-winLen;elapsed=total-left}
  return{inWin,left,total,elapsed,fastHours:Math.round((1440-winLen)/60)};
}

const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
function CK(){
  if(!S.checklist)S.checklist={items:[],logs:{},groups:[]};
  const c=S.checklist;
  if(!c.items)c.items=[];
  if(!c.logs)c.logs={};
  if(!c.incidents)c.incidents=[];
  if(!c.groups||!c.groups.length)c.groups=CK_GROUPS_DEF.map(g=>Object.assign({},g));
  if(!c.seeded&&mode!=="loading"){
    c.seeded=true;
    if(!c.items.length)c.items=CK_SEED.map(n=>({id:newId(),name:n,group:CK_QA_RE.test(n)?"qa":"hc",rule:{type:"fixed",role:/kiểm/i.test(n)?"kiem":"lam"},due:"",wd:[]}));
    persist("checklist");
  }
  if(c.seeded&&!(c.v>=2)&&mode!=="loading"){
    c.v=2;
    c.groups=CK_V2_GROUPS.map(g=>Object.assign({},g));
    const map=new Map(CK_V2_MAP.filter(x=>x[0]).map(x=>[x[0],x]));
    c.items=c.items.filter(it=>map.has(it.name)).map(it=>{const m=map.get(it.name);return Object.assign(it,{name:m[1],group:m[2]})});
    const have=new Set(c.items.map(it=>it.name));
    CK_V2_MAP.forEach(([o,n,g])=>{if(!o&&!have.has(n))c.items.push({id:newId(),name:n,group:g,rule:{type:"fixed",role:"lam"},due:"",wd:[]})});
    persist("checklist");
  }
  if(c.seeded&&!(c.v>=3)&&mode!=="loading"){
    c.v=3;
    c.groups=CK_V3_GROUPS.map(g=>Object.assign({},g));
    const m=new Map(CK_V3_MAP.map(x=>[x[0],x]));
    c.items.forEach(it=>{const x=m.get(it.name);if(x){it.name=x[1];it.group=x[2]}else it.group="khac"});
    persist("checklist");
  }
  if(c.seeded&&c.v===3&&mode!=="loading"){
    c.v=4;
    c.groups.forEach(g=>{const d=CK_V3_GROUPS.find(x=>x.id===g.id);if(d){g.icon=d.icon;g.name=d.name}});
    persist("checklist");
  }
  if(c.seeded&&c.v===4&&mode!=="loading"){
    c.v=5;
    const DROP=["Kiểm chỉ định rã đông","Tìm card và update hồ sơ sạch","Kiểm tốt và tờ xanh","Dừng rã (sổ, PM, HSBA)","KT luôn","Thông báo phôi tờ trắng","Thông báo phôi tờ vàng","In phơi IUI","In phơi và note+TDĐ/TLK","DSN5 (Tr/V)","Tham lắp"];
    c.items=c.items.filter(it=>!DROP.includes(it.name));
    c.items.forEach(it=>{if(it.name==="Hủy phôi / C' đến / C' đi")it.name="Hủy / chuyển mẫu";if(it.name==="Slg KT")it.name="SL KT"});
    persist("checklist");
  }
  if(c.seeded&&c.v===5&&mode!=="loading"){
    c.v=6;
    if(!c.items.some(it=>it.name==="TV"))c.items.push({id:newId(),name:"TV",group:"khac",rule:{type:"fixed",role:"lam"},due:"",wd:[]});
    persist("checklist");
  }
  if(c.seeded&&c.v===5&&mode!=="loading"){
    c.v=6;
    if(!c.items.some(it=>it.name==="TV"))c.items.push({id:newId(),name:"TV",group:"khac",rule:{type:"fixed",role:"lam"},due:"",wd:[]});
    persist("checklist");
  }
  if(c.seeded&&c.v===6&&mode!=="loading"){
    c.v=7;
    c.items.forEach(it=>{if(it.name==="Hủy / chuyển mẫu")it.name="Hủy/CM"});
    persist("checklist");
  }
  return c;
}
const ckRec=(day,id)=>(((CK().logs||{})[day]||{})[id])||{};
function ckSave(day,id,patch){const c=CK();c.logs[day]=c.logs[day]||{};c.logs[day][id]=Object.assign({},c.logs[day][id]||{},patch);persist("checklist")}
const ckOn=day=>{const w=parseD(day).getDay();return CK().items.filter(x=>!(x.wd&&x.wd.length)||x.wd.includes(w))};
const ckGid=it=>{const g=CK().groups;return g.some(x=>x.id===it.group)?it.group:(g[0]&&g[0].id)};
const ckOfGroup=(list,gid)=>list.filter(x=>ckGid(x)===gid);
const ckGArea=gid=>{const g=CK().groups.find(x=>x.id===gid);return (g&&g.area)||(gid==="qa"?"qa":"hc")};

function ckDayNavHtml(){

const ckRule=it=>it.rule||{type:"fixed",role:it.role||"lam"};
function ckRoleOn(day,it){
  const ov=ckRec(day,it.id).role;if(ov)return ov;
  const R=ckRule(it),d=parseD(day);
  if(R.type==="parity")return d.getDate()%2===0?(R.even||"lam"):(R.odd||"kiem");
  if(R.type==="weekday")return (R.kiemWd||[]).includes(d.getDay())?"kiem":"lam";
  return R.role||"lam";
}
function ckRuleLabel(it){
  const R=ckRule(it);
  if(R.type==="parity")return "Chẵn: "+CK_ROLES[R.even||"lam"][0]+" · Lẻ: "+CK_ROLES[R.odd||"kiem"][0];
  if(R.type==="weekday"){const k=(R.kiemWd||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(w=>WD[w]).join(" ");return "Kiểm: "+(k||"không")+" · còn lại Làm"}
  const ro=CK_ROLES[R.role||"lam"];return ro[1]+" "+ro[0];
}
function ckDue(day,it){return ckRec(day,it.id).due||it.due||""}
function ckState(day,it){
  const r=ckRec(day,it.id),t=today(),due=ckDue(day,it);
  const late=!r.done&&!!due&&(day<t||(day===t&&due<nowHM()));
  return {r,due,done:!!r.done,iss:!!r.iss,late};
}
function ckStats(day,list){
  const L=(list||ckOn(day)).map(it=>ckState(day,it));const n=L.length,done=L.filter(x=>x.done).length;
  return {n,done,pend:n-done,iss:L.filter(x=>x.iss).length,late:L.filter(x=>x.late).length,pct:n?Math.round(done/n*100):0};
}
function ckMove(id,dir){
  const c=CK();const it=c.items.find(x=>x.id===id);if(!it)return;
  const same=ckOfGroup(c.items,ckGid(it));const i=same.indexOf(it),j=i+dir;
  if(j<0||j>=same.length)return;
  const a=c.items.indexOf(it),b=c.items.indexOf(same[j]);
  [c.items[a],c.items[b]]=[c.items[b],c.items[a]];persist("checklist");
}
function ckGroupMove(id,dir){
  const g=CK().groups,i=g.findIndex(x=>x.id===id),j=i+dir;
  if(i<0||j<0||j>=g.length)return;
  [g[i],g[j]]=[g[j],g[i]];persist("checklist");
}

function ckRow(day,it){

  else{if(r.start)l2.push('<span class="chip jade">'+(role==="kiem"?"Đang kiểm":"Đang làm")+' từ '+esc(r.start)+'</span>')}
  if(s.iss)l2.push('<span class="chip red">Vấn đề</span>');

  const warn=s.iss?'<button class="ck-warn on" data-act="ck-edit" data-id="'+it.id+'" aria-label="Ghi sự cố hoặc rủi ro" title="Ghi sự cố / rủi ro">⚠️</button>':'';

function autoMonthly(){
  const t=today();let mk=monthKey(t);const vals=[];
  for(let k=0;k<3;k++){mk=prevMonth(mk);const v=sumBy(monthTx(mk),"chi");if(v>0)vals.push(v)}
  const r10=v=>Math.round(v/1e4)*1e4;
  if(vals.length)return r10(vals.reduce((a,b)=>a+b,0)/vals.length);
  const cur=sumBy(monthTx(monthKey(t)),"chi"),d=parseD(t),day=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return r10(cur/day*last);
}
function fundInfo(){const f=S.fund||(S.fund={months:6,monthly:0,balance:0,log:[]});const monthly=+f.monthly||autoMonthly();const target=monthly*f.months;

const GROUPS=[{id:"self",name:"Bản thân"},{id:"rel",name:"Các mối quan hệ"},{id:"work",name:"Sự nghiệp & tiền"},{id:"life",name:"Cuộc sống"}];
const MODULE_GROUP={money:"work",habits:"self"};
const CAT_AREA={"Ăn uống":"Ăn uống","Sức khỏe":"Sức khỏe","Gia đình":"Gia đình","Giải trí":"Giải trí & sở thích","Đi lại":"Nhà cửa & xe","Hóa đơn":"Nhà cửa & xe"};
function moduleArea(mod){
  S.areas=S.areas||[];let a=S.areas.find(x=>x.module===mod);
  if(!a){a=S.areas.find(x=>!x.module&&norm(x.name)===norm(MODULE_AREA[mod]));if(a)a.module=mod}
  if(!a){a={id:"m-"+mod,name:MODULE_AREA[mod],group:MODULE_GROUP[mod],notes:[],module:mod};S.areas.push(a)}
  if(!a.group)a.group=MODULE_GROUP[mod];
  return a;
}
function areaNames(){return S.areas&&S.areas.length?S.areas.map(a=>a.name):AREAS}
function renameRefs(oldName,newName){const o=norm(oldName);
  S.tasks.forEach(t=>{if(norm(t.tag)===o)t.tag=newName});S.goals.forEach(g=>{if(norm(g.area)===o)g.area=newName});(S.habits||[]).forEach(h=>{if(norm(h.area)===o)h.area=newName})}
function migrateAreas(){
  S.areas=S.areas||[];if((S.areasV||1)>=AREAS_V&&S.areas.length&&S.areas.every(a=>a.group))return false;
  const REN={suanha:"Nhà cửa & xe",hoc:"Học tập & phát triển",hoctap:"Học tập & phát triển",chi:"Giá trị & ý chí",ychitinhthan:"Giá trị & ý chí",ychi:"Giá trị & ý chí"};
  S.areas.forEach(a=>{const r=REN[norm(a.name)];if(r){renameRefs(a.name,r);a.name=r}const d=DEF_AREAS.find(x=>norm(x.name)===norm(a.name));if(!a.group)a.group=d?d.group:"life";if(d&&d.module&&!a.module)a.module=d.module});
  DEF_AREAS.forEach(d=>{if(!S.areas.some(a=>norm(a.name)===norm(d.name)))S.areas.push({id:newId(),name:d.name,group:d.group,notes:[],module:d.module})});
  const ix=a=>{const i=DEF_AREAS.findIndex(d=>norm(d.name)===norm(a.name));return i<0?999:i};
  S.areas=S.areas.map((a,i)=>[a,i]).sort((x,y)=>ix(x[0])-ix(y[0])||x[1]-y[1]).map(x=>x[0]);
  S.areasV=AREAS_V;
  return true;
}
let migrated=false;
function maybeMigrate(){if(mode==="loading"||migrated)return;migrated=true;if(migrateAreas()){["areas","tasks","goals","habits"].forEach(m=>persist(m));toast("Đã cập nhật Lĩnh vực theo bộ 17 mục mới")}}
function areaSpend(a,mk){const k=norm(a.name);return S.tx.filter(x=>x.type==="chi"&&monthKey(x.date)===mk&&(norm(x.cat)===k||norm(CAT_AREA[x.cat])===k)).reduce((s,x)=>s+x.amount,0)}
function areaInfo(a){
  const k=norm(a.name),t=today();
  const tasks=S.tasks.filter(x=>norm(x.tag)===k),open=tasks.filter(x=>!x.done);
  const overdue=open.filter(x=>x.due&&diffDays(x.due,t)<0).length;
  const goals=S.goals.filter(g=>norm(g.area)===k);
  const gp=goals.length?Math.round(goals.reduce((s,g)=>s+goalPct(g),0)/goals.length):null;
  const habits=(S.habits||[]).filter(h=>norm(h.area)===k);
  const sc=(a.scores||{})[monthKey(t)];
  return{tasks,open,overdue,goals,gp,habits,notes:a.notes||[],score:sc==null?null:sc};
}
function scoreCls(v){return v==null?"":v>=8?"ok":v>=5?"jade":"red"}
function prevMonth(mk){const d=parseD(mk+"-01");d.setMonth(d.getMonth()-1);return monthKey(ymd(d))}
function noteBody(a,n,clip){
  const lines=(n.text||"").split("\n");let html="",para=[],done=0,total=0;
  const flush=()=>{if(para.length){html+='<p>'+esc(para.join("\n"))+'</p>';para=[]}};
  lines.forEach((ln,i)=>{const m=ln.match(/^\s*(?:[-*]\s*)?\[( |x|X)\]\s?(.*)$/);
    if(m){flush();const ok=m[1]!==" ";total++;if(ok)done++;html+='<label class="step'+(ok?' done':'')+'"><input type="checkbox" class="check" data-act="note-check" data-area="'+a.id+'" data-id="'+n.id+'" data-i="'+i+'"'+(ok?' checked':'')+'><span>'+esc(m[2])+'</span></label>'}
    else para.push(ln)});
  flush();
  if(clip&&html.length>900&&!total)html='<p>'+esc((n.text||"").slice(0,220))+'…</p>';
  return{html,done,total};
}

function wheelSVG(areas,mk){
  const N=areas.length||1,step=Math.PI*2/N,r0=30,R=116,gap=0.012;
  const P=(r,a)=>(r*Math.cos(a)).toFixed(1)+" "+(r*Math.sin(a)).toFixed(1);
  const wedge=(r,s,e)=>'M'+P(r0,s)+'L'+P(r,s)+'A'+r+' '+r+' 0 0 1 '+P(r,e)+'L'+P(r0,e)+'A'+r0+' '+r0+' 0 0 0 '+P(r0,s)+'Z';
  let out="",rated=0,sum=0;
  areas.forEach((a,i)=>{const s=-Math.PI/2+i*step+gap,e=-Math.PI/2+(i+1)*step-gap,m=(s+e)/2;const v=(a.scores||{})[mk];
    if(v!=null){rated++;sum+=v}
    const rv=v!=null?r0+(R-r0)*v/10:0;
    const ix=(140*Math.cos(m)-9).toFixed(1),iy=(140*Math.sin(m)-9).toFixed(1);
    out+='<g class="wg g-'+(a.group||"life")+'" data-act="area-open" data-id="'+a.id+'"><title>'+esc(a.name)+': '+(v==null?'chưa chấm':v+'/10')+'</title><path d="'+wedge(R,s,e)+'" class="wt"/>'+(v!=null?'<path d="'+wedge(rv,s,e)+'" class="wv"/>':'')+'<svg x="'+ix+'" y="'+iy+'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="wi">'+areaPath(a)+'</svg></g>'});
  const avg=rated?(sum/rated).toFixed(1):"—";
  return '<svg class="wheel" viewBox="-162 -162 324 324" role="img" aria-label="Bánh xe cuộc sống: điểm trung bình '+avg+'"><circle r="'+(r0+(R-r0)/2)+'" class="wring"/>'+out+'<text y="2" class="wavg">'+avg+'</text><text y="20" class="wlbl">trung bình</text></svg>';
}

/* ---------- Review tuần ---------- */
function vReview(){
  const end=addDays(today(),-7*ui.reviewOffset),days=[];for(let i=6;i>=0;i--)days.push(addDays(end,-i));
  const inR=d=>d&&d>=days[0]&&d<=days[6];
  let done=S.tasks.filter(t=>t.done&&inR(t.doneAt)).length;S.tasks.forEach(t=>(t.hist||[]).forEach(h=>{if(inR(h))done++}));
  const added=S.tasks.filter(t=>!t.done&&t.due&&inR(t.due)&&diffDays(t.due,today())<0).length;
  const daySpend=days.map(d=>sumBy(S.tx.filter(x=>x.date===d),"chi"));const total=daySpend.reduce((a,b)=>a+b,0);const max=Math.max(1,...daySpend);
  let hDone=0,hAll=0;S.habits.forEach(h=>days.forEach(d=>{hAll++;if(habitVal(h,d)>=h.target)hDone++}));
  const hp=hAll?Math.round(hDone/hAll*100):0;
  const moods=days.map(d=>S.journal[d]&&S.journal[d].mood).filter(x=>x!=null);
  const avgMood=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:null;
  const fastKept=days.filter(d=>(S.fasting.log||[]).includes(d)).length;
  const by={};S.tx.filter(x=>x.type==="chi"&&inR(x.date)).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const lbl=parseD(days[0]).getDate()+"/"+(parseD(days[0]).getMonth()+1)+" – "+parseD(days[6]).getDate()+"/"+(parseD(days[6]).getMonth()+1);
  const nav='<div class="row" style="align-items:center"><button class="icon-btn" data-act="r-prev" aria-label="Tuần trước">'+icon("left")+'</button><span class="num" style="font-weight:600;min-width:110px;text-align:center">'+lbl+'</span><button class="icon-btn" data-act="r-next" aria-label="Tuần sau"'+(ui.reviewOffset===0?' disabled style="opacity:.3"':'')+'>'+icon("right")+'</button></div>';
  return head("Review tuần",ui.reviewOffset===0?"7 ngày vừa qua":"Tuần "+lbl,"",nav)
  +'<div class="card"><div class="stats"><div class="stat"><span class="k">Việc đã xong</span><span class="v">'+done+'</span></div><div class="stat"><span class="k">Đã chi</span><span class="v out">'+vndShort(total)+'</span></div><div class="stat"><span class="k">Thói quen đạt</span><span class="v">'+hp+'%</span></div><div class="stat"><span class="k">Giữ 16:8</span><span class="v">'+fastKept+'/7</span></div><div class="stat"><span class="k">Tâm trạng TB</span><span class="v">'+(avgMood==null?"—":MOODS[Math.round(avgMood)])+'</span></div></div></div>'
  +'<div class="grid gfill"><div class="card"><h2>Chi tiêu theo ngày</h2><div class="chart">'+days.map((d,i)=>'<div class="col"><span class="val">'+(daySpend[i]?vndShort(daySpend[i]):"")+'</span><div class="b" style="height:'+(daySpend[i]/max*100*0.78).toFixed(1)+'%"></div><span class="lbl">'+WD[parseD(d).getDay()]+'</span></div>').join("")+'</div>'+(top.length?'<p class="muted" style="margin:0">Chi nhiều nhất: '+top.map(([c,v])=>esc(c)+' '+vndShort(v)).join(" · ")+'</p>':'')+'</div>'
  +'<div class="card"><h2>Thói quen trong tuần</h2>'+(S.habits.length?S.habits.map(h=>{const k=days.filter(d=>habitVal(h,d)>=h.target).length;return '<div class="budget"><div class="l"><span>'+esc(h.name)+'</span><span>'+k+'/7 ngày</span></div><div class="bar'+(k<3?' warn':'')+'"><span style="width:'+(k/7*100)+'%"></span></div></div>'}).join(""):'<p class="empty">Chưa có thói quen.</p>')+'</div>'
  +'<div class="card"><h2>Ghi chú cho tuần sau</h2><p class="muted" style="margin:0">'+(added?'Có '+added+' việc bị trễ hạn trong tuần — cân nhắc dời ngày hoặc chia nhỏ.':'Không có việc nào bị trễ hạn trong tuần.')+(hp<50&&S.habits.length?' Tỉ lệ thói quen dưới 50%, thử giảm số thói quen xuống còn 2–3 cái quan trọng nhất.':'')+'</p></div></div>';
}

/* ---------- Toast ---------- */
let toastT=null;
// Đặt lịch nhắc lên Google Calendar của tài khoản người dùng chọn (điện thoại và máy tính cùng thấy).
// Nhắc trước bao nhiêu phút lấy từ localStorage "ns_remind_min" (mặc định 15).
let gcalTok=null;
function gcalToken(cb){
  const cid=(window.NS_CONFIG&&NS_CONFIG.googleClientId)||"";
  if(!cid){toast("Chưa cấu hình Google Client ID");return}
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){toast("Chưa tải được đăng nhập Google, thử lại sau");return}
  if(gcalTok&&gcalTok.exp>Date.now())return cb(gcalTok.t);
  const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:"https://www.googleapis.com/auth/calendar.events",
    callback:r=>{if(r&&r.access_token){gcalTok={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};cb(r.access_token)}else toast("Chưa đăng nhập Google")}});
  c.requestAccessToken({prompt:gcalTok?"":"consent"});
}
function gcalAddReminder(name,day,due){
  const mins=+(localStorage.getItem("ns_remind_min")||15)||15;
  if(!day||!due){toast("Chưa có giờ hạn");return}
  gcalToken(tok=>{
    const start=new Date(day+"T"+due+":00"),end=new Date(start.getTime()+30*60000);
    const ev={summary:name,description:"Nhịp Sống · checklist",start:{dateTime:start.toISOString()},end:{dateTime:end.toISOString()},
      reminders:{useDefault:false,overrides:[{method:"popup",minutes:mins}]}};
    fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{method:"POST",
      headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(ev)})
      .then(r=>toast(r.ok?"Đã đặt lịch, nhắc trước "+mins+" phút":"Không đặt được lịch ("+r.status+")"))
      .catch(()=>toast("Lỗi mạng, chưa đặt được lịch"));
  });
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

async function doExport(){
  syncAll();const name="nhip-song-"+today()+".json",text=JSON.stringify({v:2,people:CACHE},null,1);
  const file=new File([new Blob([text],{type:"application/json"})],name,{type:"application/json"});

    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sao lưu Nhịp Sống"});toast("Đã sao lưu");return}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(!downloads)return;
  try{await downloads.save({filename:name,data:text});toast("Đã lưu file sao lưu")}
  catch(e){if(e&&e.code!=="declined")toast("Không tạo được file sao lưu")}
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);let people;if(d&&d.v===2&&d.people&&d.people.self)people=d.people;else if(d&&Array.isArray(d.tasks))people={self:d};else throw 0;Object.keys(CACHE).forEach(k=>delete CACHE[k]);Object.keys(people).forEach(p=>{CACHE[p]=Object.assign(blankState(),people[p])});ui.person="self";loadActive();persistEverything();toast("Đã khôi phục dữ liệu");render()}catch(e){toast("File không đúng định dạng sao lưu của Nhịp Sống")}};
  r.readAsText(file);
}

function dayRes(y,m,d){const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;const k=y+"-"+pad(m)+"-"+pad(d);return {type:"day",key:k,from:k,to:k,label:"Ngày "+dateLabel(k)}}
function monRes(y,m){if(m<1||m>12)return null;const k=y+"-"+pad(m),last=pad(new Date(y,m,0).getDate());return {type:"month",key:k,from:k+"-01",to:k+"-"+last,label:"Tháng "+m+"/"+y}}
function yrRes(y){if(y<1900||y>2100)return null;return {type:"year",key:String(y),from:y+"-01-01",to:y+"-12-31",label:"Năm "+y}}
function parseOneCal(t){
  let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return dayRes(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/)))return dayRes(+m[3],+m[2],+m[1]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})$/)))return dayRes(+today().slice(0,4),+m[2],+m[1]);
  if((m=t.match(/^(?:tháng\s*)?(\d{1,2})[\/\-.\s]+(?:năm\s*)?(\d{4})$/)))return monRes(+m[2],+m[1]);
  if((m=t.match(/^tháng\s*(\d{1,2})$/)))return monRes(+today().slice(0,4),+m[1]);
  if((m=t.match(/^(?:năm\s*)?(\d{4})$/)))return yrRes(+m[1]);
  if(/^(hôm nay|hom nay|today)$/.test(t)){const d=today();{const r=dayRes(+d.slice(0,4),+d.slice(5,7),+d.slice(8,10));if(r)r.label="Hôm nay";return r}}
  return null;
}
function parseCalQuery(text){
  const q=String(text||"").trim().toLowerCase().replace(/\s+/g," ");
  if(!q)return null;
  const one=parseOneCal(q);if(one)return one;
  const m=q.match(/^(.+?)\s*(?:đến|–|—|\s-\s|-(?=\s*\d{1,2}[\/\-.]))\s*(.+)$/);
  if(!m)return null;
  const a=parseOneCal(m[1].trim()),b=parseOneCal(m[2].trim());
  if(!a||!b||a.from>b.to)return null;
  if(Math.round((parseD(b.to)-parseD(a.from))/864e5)>800)return null;
  return {type:"range",key:a.from+"|"+b.to,from:a.from,to:b.to,label:"Khoảng "+dateLabel(a.from)+" – "+dateLabel(b.to)};
}
function applyCal(r){
  ui.calPanel=false;ui.calJump=false;
  if(r.type==="range"){const days=[];for(let d=r.from;d<=r.to;d=addDays(d,1))days.push(d);ui.calScope="day";ui.calSel={day:days,month:[],year:[]};ui.calMonth=monthKey(r.from)}
  else if(r.type==="day"){ui.calScope="day";ui.calSel={day:[r.key],month:[],year:[]};ui.calMonth=monthKey(r.key)}
  else if(r.type==="month"){ui.calScope="month";ui.calSel={day:[],month:[r.key],year:[]};ui.calMonth=r.key}
  else{ui.calScope="year";ui.calSel={day:[],month:[],year:[r.key]};ui.calMonth=r.key+"-01"}
  render();
}
function calSugHtml(q){
  const t=today(),yr=+t.slice(0,4),ql=norm(q||"");const items=[];
  const pv=parseCalQuery(q);if(pv)items.push(pv);
  if(!ql||"homnay".includes(ql))items.push({type:"day",key:t,from:t,to:t,label:"Hôm nay"});
  for(let i=1;i<=12;i++){const label="Tháng "+i+"/"+yr;if(!ql||norm(label).includes(ql))items.push(monRes(yr,i)||{})}
  for(let y=yr-2;y<=yr+1;y++){const label="Năm "+y;if(!ql||norm(label).includes(ql))items.push(yrRes(y))}
  const html=items.filter(x=>x&&x.type).map(x=>'<button type="button" class="calsug-i" data-act="cal-apply" data-v="'+esc(JSON.stringify(x))+'">'+esc(x.label)+'</button>').join("");
  return html||'<p class="muted" style="margin:0">Không khớp. Thử: 05/09/2026, 09/2026, 2026, 01/09 - 15/09</p>';
}
