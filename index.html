<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nhịp Sống</title>
<meta name="description" content="Sổ quản lý cuộc sống: việc, tiền, sức khỏe, thói quen, mục tiêu">
<meta name="theme-color" content="#1D6A56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nhịp Sống">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shim.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: sổ tay hai cột — thanh điều hướng trái trên máy tính, thanh tab dưới trên điện thoại; nội dung là các thẻ xếp lưới tự co giãn */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#16221E; --ink-2:#4D5E58; --ink-3:#7A8A84;
  --line:#D6E0DB; --jade:#1D6A56; --jade-soft:#D6EBE2; --on-jade:#FFFFFF;
  --amber:#A86F14; --amber-soft:#F5E6CA; --red:#B2433A; --red-soft:#F6DEDA; --ok:#2C7A4C; --ok-soft:#DAEFE1;
  --shadow:0 1px 2px rgba(22,34,30,.06),0 4px 14px rgba(22,34,30,.05);
  --g-self:#1D6A56; --g-self-s:#D6EBE2; --g-rel:#B03A5E; --g-rel-s:#F8DDE5; --g-work:#9A600C; --g-work-s:#F6E7CB; --g-life:#2C5AA0; --g-life-s:#DCE6F6;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --surface-2:#1C2925; --ink:#E3ECE8; --ink-2:#A1B4AD; --ink-3:#71847D;
  --line:#283632; --jade:#5DC1A2; --jade-soft:#18362D; --on-jade:#0B1310;
  --amber:#E3AA4E; --amber-soft:#3A2D14; --red:#E57D72; --red-soft:#3C211E; --ok:#6EC791; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --g-self:#5DC1A2; --g-self-s:#18362D; --g-rel:#EE8AA8; --g-rel-s:#3E1E29; --g-work:#E3AA4E; --g-work-s:#3A2D14; --g-life:#8DB3EE; --g-life-s:#1B2A45;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-size:24px;font-weight:600;padding:4px 12px 2px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.side .sync{margin:2px 12px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:9px;text-align:left;color:var(--ink-2);font-weight:500}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--jade-soft);color:var(--jade)}
.side .spacer{flex:1}
.tools-row{display:flex;flex-direction:column;gap:2px}
.nav-gh{border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:8px}
.nav-gh:hover{background:var(--surface-2)}
.nav-gh span:nth-child(2){flex:1}
.nav-gh .chev{font-size:10px;color:var(--ink-3)}
.nav-icons{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 4px}
.nav-ic{border:0;background:none;padding:2px;border-radius:9px}
.nav-ic:hover,.nav-ic[aria-current="page"]{background:var(--gs)}
.nav-ic .aicon.sm{width:30px;height:30px}
.side .quick-btn{margin:8px 4px 0}

main{padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.sub{color:var(--ink-2);margin:4px 0 0}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .link{font-size:13px;font-weight:500;color:var(--jade);background:none;border:0;padding:0}
.span2{grid-column:1/-1}
.muted{color:var(--ink-3);font-size:13px}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.icon-btn{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:7px;display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.confirm{color:var(--red);background:var(--red-soft)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 140px}
.bf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bf-grid>.field{min-width:0;margin:0}
@media (max-width:480px){.bf-grid{grid-template-columns:1fr}}
.gym-page{display:grid;gap:10px}
.gym-top{display:flex;align-items:center;gap:8px;min-height:44px}.gym-top>b{font-size:18px}.gym-top .muted{margin-left:auto;font-size:13px}
.gym-wrap{display:grid;gap:12px}
.gym-col{display:grid;gap:12px;align-content:start;min-width:0}
.gym-h{margin:0 0 8px;font-size:15px}
.gym-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.gym-card{display:grid;gap:10px;padding:10px 12px}
.gym-r1>.field,.gym-r3>.field{flex:1 1 0;min-width:0}
.gym-page .field{min-width:0;margin:0;display:grid;gap:4px}
.gym-page .field>label{font-size:12px;opacity:.75;margin:0;line-height:1.2}
.gym-page .row{gap:8px;align-items:flex-end;flex-wrap:nowrap}
.gym-page .row>.field{flex:1 1 0;min-width:0}
.gym-page input,.gym-page select{box-sizing:border-box;height:44px;width:100%;min-width:0;margin:0;padding:0 10px;font:inherit;font-size:15px;line-height:1.2}
.gym-page input[type=date],.gym-page input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0}
.gym-seg{display:flex;gap:6px}
.gym-seg button{flex:1;height:40px;border:1px solid rgba(127,127,127,.35);border-radius:10px;background:none;font-size:18px;cursor:pointer}
.gym-seg button[aria-pressed="true"]{background:#5fc4a0;border-color:#5fc4a0}
.gym-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gym-days button{height:36px;border:1px solid rgba(127,127,127,.35);border-radius:8px;background:none;font:inherit;font-size:13px;cursor:pointer}
.gym-days button[aria-pressed="true"]{background:#5fc4a0;color:#0b1a14;border-color:#5fc4a0}
.gym-inrow{display:flex;gap:5px;align-items:center;margin-top:6px}
.gym-inrow>*{min-width:0;height:40px;font-size:14px;margin:0;box-sizing:border-box}
.gym-inrow>select{flex:2.2 1 0}.gym-inrow>input:not(.gx-n){flex:1 1 0}
.gym-inrow>.gx-n{flex:0 0 50px;padding:0 6px;text-align:center}
.gym-inrow>input[type=time]{flex:1 1 0;padding:0 6px;-webkit-appearance:none;appearance:none}
.gym-plus{flex:0 0 40px;padding:0;font-size:20px;line-height:1;border-radius:10px;border:1px solid rgba(127,127,127,.35);background:none;cursor:pointer}
.gym-inrow .gym-plus.btn.primary{background:#5fc4a0;color:#0b1a14;border-color:#5fc4a0}
.gym-save{flex:0 0 52px;padding:0}
.gym-inrow>input.gx-n{flex:0 0 48px}
.gym-inrow>input[type=number]{padding:0 4px;text-align:center}
.gym-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;min-height:24px;align-items:center}
.gym-x{border:0;background:none;color:inherit;font-size:14px;padding:0 0 0 4px;cursor:pointer;opacity:.7}
.gym-gchip{border:1px solid rgba(127,127,127,.35);background:none;border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.gym-gchip[aria-pressed="true"]{background:#5fc4a0;color:#0b1a14;border-color:#5fc4a0}
.gym-gchip small{opacity:.7;margin-left:4px}
.gym-gicons .gym-gchip{font-size:17px;padding:4px 12px}
.gico{width:20px;height:20px;vertical-align:-4px}
.gym-gicons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gym-gicons .gym-gchip{padding:6px 0;display:flex;align-items:center;justify-content:center;min-width:0}
.gym-anat-wrap{margin:4px 0 10px;touch-action:pan-y}
.gym-turn{position:relative;height:340px;perspective:1000px;user-select:none}
.gym-face{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.gym-f{transform:rotateY(var(--r))}
.gym-b{transform:rotateY(calc(var(--r) + 180deg))}
.gym-anat{height:340px;width:auto;max-width:100%;cursor:grab}
.gym-anat path{stroke:#1d2220;stroke-width:3;stroke-linejoin:round}
.gym-anat path.gym-dim{fill:#3c4341}
.gym-anat path.gym-reg{fill:#b9c4bf;cursor:pointer}
.gym-anat path.gym-reg:hover{fill:#8fd3b6}
.gym-anat path.gym-reg.on{fill:#3fae85}
.gym-anat-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.gym-split{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.gym-split .gym-anat-wrap{flex:1 1 0;min-width:0;margin:0}
.gym-3d{width:100%;height:270px;touch-action:none;cursor:grab;position:relative}
.gym-zoom{position:absolute;top:2px;right:2px;display:flex;flex-direction:column;gap:3px;z-index:2}
.gym-zoom button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.12);color:inherit;font:inherit;font-size:15px;line-height:1;padding:0;cursor:pointer}
.gym-exbtn small{display:block;font-size:11px;opacity:.7;line-height:1.2}
.gym-vt{display:block;font-style:normal;font-size:12px;color:#2f9e6f;line-height:1.25}
.gym-exbtn[aria-pressed="true"] .gym-vt{color:#0b4a33}
.gym-exwrap{display:flex;gap:4px;align-items:stretch}
.gym-exwrap .gym-exbtn{flex:1 1 0;min-width:0}
.gym-star{flex:0 0 34px;border:1px solid rgba(127,127,127,.35);background:none;border-radius:10px;font-size:18px;color:inherit;cursor:pointer;padding:0;opacity:.55}
.gym-star[aria-pressed="true"]{opacity:1;color:#e0a800;border-color:#e0a800}
.gym-favbtn[aria-pressed="true"]{color:#e0a800;border-color:#e0a800}
.gym-libq{font-size:14px;padding:7px 10px;margin:4px 0 6px}
.gym-liblist{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto;padding-right:2px;margin-bottom:8px}
.gym-del{font-size:16px;flex-basis:30px}
.gym-exlist .gym-libq{flex:none;margin:0 0 2px}
.gym-zoom button[aria-pressed="true"]{background:#5fc4a0;color:#0b1a14}
.gym-3d-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.gym-credit{font-size:9px;margin-top:1px;opacity:.6;text-align:center}
.gym-credit a{color:inherit}
.gym-exchip{cursor:pointer}
.gym-exchip[aria-pressed="true"]{background:#5fc4a0;color:#0b1a14;border-color:#5fc4a0}
.gym-exdetail{flex:1 1 0;min-width:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.gym-step-num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent,#1f7a5a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:2px}
.gym-photos{display:flex;gap:6px;margin:2px 0}.gym-photos figure{margin:0;flex:1 1 0;min-width:0;text-align:center}.gym-photos img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--bg2,#eee);display:block;cursor:zoom-in}
.gym-ph-anim figcaption .ph0{font-weight:700;color:var(--accent,#1f7a5a)}.gym-ph-anim.end figcaption .ph0{font-weight:400;color:inherit}.gym-ph-anim.end figcaption .ph1{font-weight:700;color:var(--accent,#1f7a5a)}.gym-photos figcaption{font-size:11px;color:var(--muted,#777);margin-top:2px}
.gym-ph-anim>div{position:relative;aspect-ratio:3/2;border-radius:8px;overflow:hidden}.gym-ph-anim>div img{position:absolute;inset:0;aspect-ratio:auto;height:100%;cursor:default;transition:opacity .45s ease}.gym-ph-anim>div img.b{opacity:0}.gym-ph-anim.end>div img.b{opacity:1}
.gym-photo-full{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.gym-photo-full .gym-ph-anim{margin:0}.gym-photo-full .gym-ph-anim>div img{object-fit:contain;background:#000}.gym-photo-cap{color:#ddd;font-size:13px}.gym-photo-full img{max-width:100%;max-height:100%;object-fit:contain}
.gym-exd-t{font-weight:700;font-size:15px}
.gym-exd-rec{font-size:13px;opacity:.8}
.gym-exd-h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.6;margin-top:4px}
.gym-mtags{display:flex;flex-wrap:wrap;gap:4px}
.gym-mtag{display:inline-flex;flex-direction:column;align-items:center;padding:3px 6px;border-radius:7px;background:#2f9e6f;color:#fff;font-weight:700;font-size:11px;line-height:1.1;max-width:100%}
.gym-mtag small{font-weight:400;font-size:9px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.gym-mtags.sec .gym-mtag,.gym-mtag.sec{background:#9fd8bd;color:#0b1a14}
.gym-exd-tip{font-size:12px;line-height:1.35;margin-top:4px}
.gym-exd-hist{font-size:12px}
.gym-leftcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.gym-leftcol .gym-anat-wrap{margin:0}
.gym-mcs{display:flex;flex-direction:column;gap:4px}
.gym-mcrow{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.gym-mcl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.6;width:34px;flex:none}
.gym-mcs{margin:2px 0 10px}
.gym-mc{display:inline-flex;align-items:baseline;gap:3px;font-size:11px;line-height:1.2;padding:2px 6px;border-radius:999px;white-space:nowrap}
.gym-mc b{font-size:10px}
.gym-mc.p{background:#2f9e6f;color:#fff}
.gym-mc.s{background:#9fd8bd;color:#0b1a14}
.gym-lanim-wrap{position:relative;cursor:pointer;margin-top:4px}
.gym-exd2{gap:6px}
.gym-dayd{margin-top:8px;border:1px solid rgba(127,127,127,.25);border-radius:12px;padding:8px 10px;font-size:13px;background:rgba(127,127,127,.06)}.gym-dayd.done{border-color:rgba(47,158,111,.45)}
.gym-dayd-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}.gym-dayd-h b{font-size:14px;display:block}.gym-dayd-h small{display:block;font-size:11.5px;opacity:.7;margin-top:1px}
.gym-pill{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(127,127,127,.18)}.gym-pill.ok{background:#2f9e6f;color:#fff}.gym-pill.miss{background:#e07b39;color:#fff}.gym-pill.pr{background:#e0a800;color:#1a1400;font-size:9.5px;padding:1px 5px;margin-left:4px}

  if(h.routineOff.includes(id)||h.routines.some(rt=>rt.from===id))return null;return {id,name:g,auto:true}}
function rtIcon(n){const t=norm(n);return /da|mat|skin|mun/.test(t)?"🧴":/toc|dau/.test(t)?"💆":/mui|hong|tai/.test(t)?"👃":/rang|mieng/.test(t)?"🪥":/mat|nho/.test(t)?"👁️":"🧩"}
function rtSort(rt,list){const M=x=>x.m||(x.x&&x.x.m)||{};const ord=x=>{const m=M(x);if(!rt.auto){const i=(rt.keys||[]).indexOf(medKey(m.name));return i<0?999:i}const v=parseFloat(m.info&&m.info.step);return isNaN(v)?999:v};return list.slice().sort((a,b)=>ord(a)-ord(b)||String(M(a).name).localeCompare(String(M(b).name)))}

/* Tách danh sách thuốc trong một buổi: nhóm theo quy trình (≥2 bước với nhóm tự động, ≥1 với nhóm anh tự tạo) + thuốc lẻ */
function rtSplit(list){const B=new Map(),solo=[];list.forEach(it=>{const rt=rtOf(it.x.m);if(!rt){solo.push(it);return}if(!B.has(rt.id))B.set(rt.id,{rt,list:[]});B.get(rt.id).list.push(it)});
  const groups=[];B.forEach(g=>{if(g.rt.auto&&g.list.length<2)solo.push(...g.list);else groups.push(g)});return {groups,solo}}

function todHtml(meds,ds){
  const cols=[["sáng","🌅","Sáng","trước bữa sáng"],["trưa","☀️","Trưa","bữa trưa"],["chiều","🌇","Chiều","chiều"],["tối","🌙","Tối","bữa tối"]];
  const B={};cols.forEach(([w])=>B[w]=[]);B.times=[];B.as=[];B.none=[];
  let luot=0,kd=0;
  meds.forEach(x=>{const ph=x.phases.find(p=>p.st<=ds&&ds<=p.end)||x.phases[0],sl=timeOfDay(ph.how),it={x,ph};
    if(asNeeded(ph.how)){B.as.push(it);return}
    if(!sl.length){B.none.push(it);return}
    luot+=sl.length;kd++;
    const tm=sl.filter(w=>w.includes(':'));if(tm.length)B.times.push(Object.assign({times:tm.join(', ')},it));
    sl.filter(w=>!w.includes(':')).forEach(w=>B[w].push(it));
  });
  const short=n=>String(n||"").split("(")[0].trim();
  const vn=m=>m&&([whatOf(m.info),mealLbl(m)].filter(Boolean).join(' · '));
  const lbl=m=>esc(short(m.name));
  const sub=m=>vn(m)?'<small>'+esc(vn(m))+'</small>':'';
  const chip=({x,ph,times})=>'<button type="button" class="chip-m'+(vn(x.m)?' vn':'')+'" data-act="med-open" data-rid="'+x.r.id+'" data-mi="'+x.mi+'" title="'+esc(x.m.name)+'">'+lbl(x.m)+(times?'<span>'+esc(times)+'</span>':'')+(x.m.src==='mua'?'<span>🛒</span>':'')+sub(x.m)+'</button>';
  const gchip=g=>{const st=rtSort(g.rt,g.list);return '<button type="button" class="chip-m grp" data-act="rt-open" data-rt="'+esc(g.rt.id)+'" data-ds="'+ds+'">'+rtIcon(g.rt.name)+' <b>'+esc(g.rt.name)+'</b><span>'+st.length+' bước ›</span><small>'+st.map((it,i)=>(i+1)+'. '+esc(whatOf(it.x.m.info)||short(it.x.m.name))).join(' → ')+'</small></button>'};
  const body=(list,grp)=>{if(!grp)return list.map(chip).join('');const sp=rtSplit(list);return sp.groups.map(gchip).join('')+sp.solo.map(chip).join('')};
  const row=(ic,label,hint,list,empty,grp)=>'<div class="tl"><div class="tl-h">'+ic+' '+label+' <span class="cnt">'+list.length+'</span><small>'+hint+'</small></div><div>'+(list.length?'<div class="chips">'+body(list,grp)+'</div>':'<div class="tod-empty">'+empty+'</div>')+'</div></div>';
  const summary='<p class="muted" style="margin:2px 0 6px">'+meds.length+' thuốc · '+luot+' lượt uống · '+kd+' thuốc có giờ</p>';
  const timeRows=cols.map(([w,ic,l,h])=>row(ic,l,h,B[w],'Không có thuốc',true)).join('');
  const extra=row('⏰','Theo giờ','cách nhau theo giờ',B.times,'Không có')+row('🆘','Khi cần','chỉ dùng khi có triệu chứng',B.as,'Không có');
  const none=B.none.length?'<details class="tl-more"><summary>❔ Chưa ghi giờ dùng ('+B.none.length+') · bấm để xem</summary><div class="chips" style="padding:6px 0">'+B.none.map(chip).join('')+'</div></details>':'';
  const skd=medSpans().filter(x=>x.st<=ds&&ds<=x.end&&skipOn(x.m,ds));
  const skRow=skd.length?'<div class="tl"><div class="tl-h">⛔ Bỏ hôm nay <span class="cnt">'+skd.length+'</span></div><div class="chips">'+skd.map(x=>'<button type="button" class="chip-m'+(vn(x.m)?' vn':'')+'" data-act="med-open" data-rid="'+x.r.id+'" data-mi="'+x.mi+'">'+lbl(x.m)+'<span>'+esc(skipOn(x.m,ds).note||'không dùng')+'</span>'+sub(x.m)+'</button>').join('')+'</div></div>':'';
  const rtBtn='<p style="margin:6px 0 0"><button type="button" class="btn sm" data-act="rt-new" data-ds="'+ds+'">🧩 Gộp thuốc thành quy trình</button> <span class="muted" style="font-size:12px">vd: chăm sóc da gồm bước 1, 2, 3…</span></p>';
  return summary+'<div class="tlwrap">'+timeRows+extra+skRow+'</div>'+none+rtBtn+'<div class="tod-h" style="margin:12px 0 2px">Chi tiết từng thuốc</div>';

function medReport(name){
  const key=name.trim().toLowerCase(),t=today();
  const spans=medSpans().filter(x=>x.m.name.trim().toLowerCase()===key).sort((a,b)=>a.st.localeCompare(b.st));
  if(!spans.length)return '<p class="empty">Chưa có thuốc này trong hồ sơ.</p>';
  return spans.map(x=>{let taken=0,totalDays=0,slots=0;
    x.phases.forEach(p=>{const cap=p.end<t?p.end:t;if(p.st<=cap)taken+=dayDiff(p.st,cap)+1;totalDays+=p.days;slots+=timeOfDay(p.how).length*p.days});
    const first=x.st,lastEnd=x.end;
    const remain=lastEnd==="9999-12-31"?'':(lastEnd>=t?dayDiff(t,lastEnd):0);
    return '<div class="cs-blk"><b>Đơn '+esc(dateLabel(x.r.date))+' · '+esc(x.r.title||dShort(x.r.dept))+'</b><small>Dùng từ '+esc(dateLabel(first))+(lastEnd==="9999-12-31"?' (lâu dài)':' đến '+esc(dateLabel(lastEnd)))+(totalDays?' · tổng '+totalDays+' ngày':'')+'</small>'
      +'<p class="muted">Đã dùng đến hôm nay: <b>'+taken+' ngày</b>'+(remain!==''?' · còn '+remain+' ngày':'')+(slots?' · dự kiến '+slots+' lượt':'')+'</p>'+phasesHtml(x.m,x.st,x.r.next)+'</div>';
  }).join('');
}

/* Ảnh cho Claude đọc qua Google Drive: đổi sang JPG (HEIC của iPhone thì Drive connector không đọc được), đặt tên chung một mã để Claude tìm. */
async function toJpeg(f,name){
  if(f.type==="application/pdf")return new File([f],name+".pdf",{type:"application/pdf"});
  try{const bm=await createImageBitmap(f),k=Math.min(1,2400/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));if(b)return new File([b],name+".jpg",{type:"image/jpeg"})}catch(e){}
  return null;
}
async function aiDrivePrepare(list){
  const st=$("#ai-drive-st");if(st)st.textContent="Đang đổi sang JPG…";
  const batch="NS-"+today().replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6);
  const out=[];let bad=0;
  for(let i=0;i<list.length;i++){const f=await toJpeg(list[i],batch+"-"+String(i+1).padStart(2,"0"));if(f)out.push(f);else bad++}
  ui.aiDrive={batch,files:out};
  if(st)st.textContent=out.length?"Đã chọn "+out.length+" ảnh"+(bad?" ("+bad+" ảnh không đổi được)":""):"Không đổi được ảnh nào sang JPG";
}

const REC_SCHEMA=(()=>{const S_=()=>({type:"string"});const obj=(keys)=>({type:"object",properties:Object.fromEntries(keys.map(k=>[k,S_()])),required:keys,additionalProperties:false});
  const item=obj(["date","dept","title","place","doctor","diagnosis","next","nextTime","notes","issue","albumName","album"]);
  item.properties.files={type:"array",items:{type:"string"}};
  item.properties.labs={type:"array",items:obj(["name","value","unit","lo","hi"])};
  const medS=obj(["name","dose","how","days"]);medS.properties.src={type:"string",enum:["don","mua"]};medS.properties.phases={type:"array",items:obj(["days","dose","how"])};medS.required.push("phases");const infoS=obj(["what","group","step","meal","role","usage","warnings","summary","sourceDoc","album"]);infoS.properties.evidence={type:"array",items:obj(["point","source","url"])};infoS.required.push("evidence");medS.properties.info=infoS;medS.required.push("info");item.properties.meds={type:"array",items:medS};
  item.properties.items={type:"array",items:{type:"object",properties:{kind:{type:"string",enum:["img","other"]},title:{type:"string"},qty:{type:"string"},price:{type:"string"},amount:{type:"string"},detail:{type:"string"},info:infoS},required:["kind","title","qty","price","amount","detail","info"],additionalProperties:false}};
  item.required=item.required.concat(["files","labs","meds","items"]);
  ["costTotal","costDiscount","costPaid","payMethod","receiptNo"].forEach(k=>{item.properties[k]=S_();item.required.push(k)});
  return {type:"object",properties:{records:{type:"array",items:item}},required:["records"],additionalProperties:false}})();

async function shrink(f){

  try{const bm=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b&&b.size<f.size?b:f}catch(e){return f}
}

const WORDDAY={"hai":1,"ba":2,"tư":3,"tu":3,"năm":4,"nam":4,"sáu":5,"sau":5,"bảy":6,"bay":6};
function nextWeekday(wd){const d=new Date();const diff=(wd-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return ymd(d)}
function parseAmount(str){
  let s=str,m;
  m=s.match(/(?:^|\s)(\d{1,3}(?:\.\d{3})+)\s*(?:đ|d|vnd)?(?=\s|$)/i);
  if(m)return{v:+m[1].replace(/\./g,""),raw:m[0]};
  m=s.match(/(?:^|\s)(\d+)\s*(?:tr|triệu)\s*(\d{1,3})(?=\s|$)/i);
  if(m)return{v:+m[1]*1e6+ +m[2]*Math.pow(10,6-m[2].length),raw:m[0]};
  m=s.match(/(?:^|\s)[+-]?(\d+(?:[.,]\d+)?)\s*(k|nghìn|ngàn|tr|triệu|m|đ|d)?(?=\s|$)/i);
  if(m){let v=parseFloat(m[1].replace(",","."));const u=(m[2]||"").toLowerCase();
    if(u==="k"||u==="nghìn"||u==="ngàn")v*=1e3;else if(u==="tr"||u==="triệu"||u==="m")v*=1e6;else if(!u||u==="đ"||u==="d"){if(v<1000)v*=1e3}
    return{v:Math.round(v),raw:m[0]}}
  return null;
}
function guessCat(note,type){
  const n=note.toLowerCase();
  if(type==="thu")return /thưởng|bonus/.test(n)?"Thưởng":/lương/.test(n)?"Lương":"Thu khác";
  const R=[["Ăn uống",/ăn|cơm|phở|bún|cafe|cà phê|cf|trà|chợ|siêu thị|bánh|nước|nhậu|lẩu|trưa|tối|sáng/],["Đi lại",/xăng|grab|be |taxi|xe|gửi xe|vé|bus/],["Hóa đơn",/điện|nước|internet|mạng|wifi|điện thoại|gas|nhà/],["Sức khỏe",/thuốc|khám|viện|gym|bảo hiểm/],["Giải trí",/phim|game|netflix|spotify|du lịch|karaoke/],["Gia đình",/bố|mẹ|con|vợ|chồng|em|anh|chị|quà/],["Mua sắm",/mua|áo|quần|giày|shopee|lazada|tiki/]];
  for(const [c,re] of R)if(re.test(n))return c;return "Khác";
}
function parseQuick(text){
  let s=" "+text.trim()+" ";
  const txm=s.match(/^\s(chi|tiêu|thu|nhận|[+-])\s*/i);
  if(txm){
    const head=txm[1].toLowerCase();const type=(head==="thu"||head==="nhận"||head==="+")?"thu":"chi";
    const rest=s.slice(txm[0].length);const a=parseAmount(" "+rest);
    if(a){let note=(" "+rest).replace(a.raw," ");let date=today();
      if(/(^|\s)hôm qua(?=\s|$)/i.test(note)){date=addDays(today(),-1);note=note.replace(/(^|\s)hôm qua(?=\s|$)/i," ")}
      note=note.replace(/\s+/g," ").trim();
      return{kind:"tx",type,amount:a.v,note:note||(type==="thu"?"Khoản thu":"Khoản chi"),cat:guessCat(note,type),date}}
  }
  const r={kind:"task",title:"",due:"",time:"",prio:0,tag:"",repeat:"none"};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(re," ")}};
  take(/\s!+(?=\s)/,()=>r.prio=2);
  take(/\s#([^\s#]+)(?=\s)/,m=>r.tag=m[1]);
  take(/\s(hằng|hàng|mỗi)\s(ngày|tuần|tháng)(?=\s)/i,m=>r.repeat={"ngày":"daily","tuần":"weekly","tháng":"monthly"}[m[2].toLowerCase()]);
  take(/\s(\d{1,2})[:h](\d{2})?(?=\s)/i,m=>{const h=+m[1];if(h<24)r.time=pad(h)+":"+pad(+(m[2]||0))});
  take(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/,m=>{let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&diffDays(ymd(d),today())<-60)d.setFullYear(y+1);r.due=ymd(d)});
  take(/\s(hôm nay|hnay)(?=\s)/i,()=>r.due=today());
  take(/\s(ngày kia|mốt)(?=\s)/i,()=>r.due=addDays(today(),2));
  take(/\s(ngày mai|mai)(?=\s)/i,()=>r.due=addDays(today(),1));
  take(/\stuần sau(?=\s)/i,()=>r.due=addDays(today(),7));
  take(/\s(chủ nhật|cn)(?=\s)/i,()=>r.due=nextWeekday(0));
  take(/\s(?:thứ\s?|t)([2-7])(?=\s)/i,m=>r.due=nextWeekday(+m[1]-1));
  take(/\sthứ\s(hai|ba|tư|tu|năm|nam|sáu|sau|bảy|bay)(?=\s)/i,m=>r.due=nextWeekday(WORDDAY[m[1].toLowerCase()]));
  if(r.repeat!=="none"&&!r.due)r.due=today();
  r.title=s.replace(/\s+/g," ").trim();
  r.title=r.title.charAt(0).toUpperCase()+r.title.slice(1);
  return r;
}

function billStatus(b){
  const t=today(),mk=monthKey(t);const paid=(b.paid||[]).includes(mk);
  const td=parseD(t);const last=new Date(td.getFullYear(),td.getMonth()+1,0).getDate();
  const due=ymd(new Date(td.getFullYear(),td.getMonth(),Math.min(b.day,last)));
  return{paid,due,days:diffDays(due,t)};
}
function docStatus(d){if(!d.expiry)return{cls:"",label:"Không thời hạn",days:9999};const n=diffDays(d.expiry,today());
  if(n<0)return{cls:"red",label:"Hết hạn "+(-n)+" ngày",days:n};if(n===0)return{cls:"red",label:"Hết hạn hôm nay",days:0};
  if(n<=30)return{cls:"amber",label:"Còn "+n+" ngày",days:n};return{cls:"ok",label:"Còn hạn · "+dateLabel(d.expiry),days:n}}
function habitVal(h,day){return (h.log&&h.log[day])||0}
function streak(h){let n=0,d=today();if(habitVal(h,d)<h.target)d=addDays(d,-1);while(habitVal(h,d)>=h.target){n++;d=addDays(d,-1)}return n}
function goalPct(g){const st=g.steps||[];if(!st.length)return 0;return Math.round(st.filter(x=>x.done).length/st.length*100)}
function mins(hm){const p=(hm||"0:0").split(":");return +p[0]*60+ +p[1]}
function fastNow(){
  const f=S.fasting,now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const a=mins(f.from),b=mins(f.to);const inWin=a<=b?(cur>=a&&cur<b):(cur>=a||cur<b);
  const winLen=((b-a)+1440)%1440||1440;
  let left,total,elapsed;
  if(inWin){left=((b-cur)+1440)%1440;total=winLen;elapsed=total-left}
  else{left=((a-cur)+1440)%1440;total=1440-winLen;elapsed=total-left}
  return{inWin,left,total,elapsed,fastHours:Math.round((1440-winLen)/60)};
}
const hm=m=>Math.floor(m/60)+" giờ "+pad(m%60)+" phút";

function groupTasks(list){
  const t=today(),g={"Quá hạn":[],"Hôm nay":[],"Ngày mai":[],"7 ngày tới":[],"Sau này":[],"Không có hạn":[]};
  list.forEach(x=>{if(!x.due)g["Không có hạn"].push(x);else{const d=diffDays(x.due,t);if(d<0)g["Quá hạn"].push(x);else if(d===0)g["Hôm nay"].push(x);else if(d===1)g["Ngày mai"].push(x);else if(d<=7)g["7 ngày tới"].push(x);else g["Sau này"].push(x)}});

function CK(){
  if(!S.checklist)S.checklist={items:[],logs:{},groups:[]};
  const c=S.checklist;
  if(!c.items)c.items=[];
  if(!c.logs)c.logs={};
  if(!c.incidents)c.incidents=[];
  if(!c.groups||!c.groups.length)c.groups=CK_GROUPS_DEF.map(g=>Object.assign({},g));
  if(!c.seeded&&mode!=="loading"){
    c.seeded=true;
    if(!c.items.length)c.items=CK_SEED.map(n=>({id:newId(),name:n,group:CK_QA_RE.test(n)?"qa":"hc",rule:{type:"fixed",role:/kiểm/i.test(n)?"kiem":"lam"},due:"",wd:[]}));
    persist("checklist");
  }
  if(c.seeded&&!(c.v>=2)&&mode!=="loading"){
    c.v=2;
    c.groups=CK_V2_GROUPS.map(g=>Object.assign({},g));
    const map=new Map(CK_V2_MAP.filter(x=>x[0]).map(x=>[x[0],x]));
    c.items=c.items.filter(it=>map.has(it.name)).map(it=>{const m=map.get(it.name);return Object.assign(it,{name:m[1],group:m[2]})});
    const have=new Set(c.items.map(it=>it.name));
    CK_V2_MAP.forEach(([o,n,g])=>{if(!o&&!have.has(n))c.items.push({id:newId(),name:n,group:g,rule:{type:"fixed",role:"lam"},due:"",wd:[]})});
    persist("checklist");
  }
  if(c.seeded&&!(c.v>=3)&&mode!=="loading"){
    c.v=3;
    c.groups=CK_V3_GROUPS.map(g=>Object.assign({},g));
    const m=new Map(CK_V3_MAP.map(x=>[x[0],x]));
    c.items.forEach(it=>{const x=m.get(it.name);if(x){it.name=x[1];it.group=x[2]}else it.group="khac"});
    persist("checklist");
  }
  if(c.seeded&&c.v===3&&mode!=="loading"){
    c.v=4;
    c.groups.forEach(g=>{const d=CK_V3_GROUPS.find(x=>x.id===g.id);if(d){g.icon=d.icon;g.name=d.name}});
    persist("checklist");
  }
  if(c.seeded&&c.v===4&&mode!=="loading"){
    c.v=5;
    const DROP=["Kiểm chỉ định rã đông","Tìm card và update hồ sơ sạch","Kiểm tốt và tờ xanh","Dừng rã (sổ, PM, HSBA)","KT luôn","Thông báo phôi tờ trắng","Thông báo phôi tờ vàng","In phơi IUI","In phơi và note+TDĐ/TLK","DSN5 (Tr/V)","Tham lắp"];
    c.items=c.items.filter(it=>!DROP.includes(it.name));
    c.items.forEach(it=>{if(it.name==="Hủy phôi / C' đến / C' đi")it.name="Hủy / chuyển mẫu";if(it.name==="Slg KT")it.name="SL KT"});
    persist("checklist");
  }
  if(c.seeded&&c.v===5&&mode!=="loading"){
    c.v=6;
    if(!c.items.some(it=>it.name==="TV"))c.items.push({id:newId(),name:"TV",group:"khac",rule:{type:"fixed",role:"lam"},due:"",wd:[]});
    persist("checklist");
  }
  if(c.seeded&&c.v===5&&mode!=="loading"){
    c.v=6;
    if(!c.items.some(it=>it.name==="TV"))c.items.push({id:newId(),name:"TV",group:"khac",rule:{type:"fixed",role:"lam"},due:"",wd:[]});
    persist("checklist");
  }
  if(c.seeded&&c.v===6&&mode!=="loading"){
    c.v=7;
    c.items.forEach(it=>{if(it.name==="Hủy / chuyển mẫu")it.name="Hủy/CM"});
    persist("checklist");
  }
  return c;
}

function ckRoleOn(day,it){
  const ov=ckRec(day,it.id).role;if(ov)return ov;
  const R=ckRule(it),d=parseD(day);
  if(R.type==="parity")return d.getDate()%2===0?(R.even||"lam"):(R.odd||"kiem");
  if(R.type==="weekday")return (R.kiemWd||[]).includes(d.getDay())?"kiem":"lam";
  return R.role||"lam";
}
function ckRuleLabel(it){

function ckState(day,it){
  const r=ckRec(day,it.id),t=today(),due=ckDue(day,it);
  const late=!r.done&&!!due&&(day<t||(day===t&&due<nowHM()));

function ckStats(day,list){
  const L=(list||ckOn(day)).map(it=>ckState(day,it));const n=L.length,done=L.filter(x=>x.done).length;

function autoMonthly(){
  const t=today();let mk=monthKey(t);const vals=[];
  for(let k=0;k<3;k++){mk=prevMonth(mk);const v=sumBy(monthTx(mk),"chi");if(v>0)vals.push(v)}
  const r10=v=>Math.round(v/1e4)*1e4;
  if(vals.length)return r10(vals.reduce((a,b)=>a+b,0)/vals.length);
  const cur=sumBy(monthTx(monthKey(t)),"chi"),d=parseD(t),day=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return r10(cur/day*last);
}

const GROUPS=[{id:"self",name:"Bản thân"},{id:"rel",name:"Các mối quan hệ"},{id:"work",name:"Sự nghiệp & tiền"},{id:"life",name:"Cuộc sống"}];
const MODULE_GROUP={money:"work",habits:"self",gym:"self"};
const CAT_AREA={"Ăn uống":"Ăn uống","Sức khỏe":"Sức khỏe","Gia đình":"Gia đình","Giải trí":"Giải trí & sở thích","Đi lại":"Nhà cửa & xe","Hóa đơn":"Nhà cửa & xe"};
function moduleArea(mod){
  S.areas=S.areas||[];let a=S.areas.find(x=>x.module===mod);
  if(!a){a=S.areas.find(x=>!x.module&&norm(x.name)===norm(MODULE_AREA[mod]));if(a)a.module=mod}
  if(!a){a={id:"m-"+mod,name:MODULE_AREA[mod],group:MODULE_GROUP[mod],notes:[],module:mod};S.areas.push(a)}
  if(!a.group)a.group=MODULE_GROUP[mod];
  return a;
}
function areaNames(){return S.areas&&S.areas.length?S.areas.map(a=>a.name):AREAS}
function renameRefs(oldName,newName){const o=norm(oldName);
  S.tasks.forEach(t=>{if(norm(t.tag)===o)t.tag=newName});S.goals.forEach(g=>{if(norm(g.area)===o)g.area=newName});(S.habits||[]).forEach(h=>{if(norm(h.area)===o)h.area=newName})}
function migrateAreas(){
  S.areas=S.areas||[];if((S.areasV||1)>=AREAS_V&&S.areas.length&&S.areas.every(a=>a.group))return false;
  const REN={suanha:"Nhà cửa & xe",hoc:"Học tập & phát triển",hoctap:"Học tập & phát triển",chi:"Giá trị & ý chí",ychitinhthan:"Giá trị & ý chí",ychi:"Giá trị & ý chí"};
  S.areas.forEach(a=>{const r=REN[norm(a.name)];if(r){renameRefs(a.name,r);a.name=r}const d=DEF_AREAS.find(x=>norm(x.name)===norm(a.name));if(!a.group)a.group=d?d.group:"life";if(d&&d.module&&!a.module)a.module=d.module});
  DEF_AREAS.forEach(d=>{if(!S.areas.some(a=>norm(a.name)===norm(d.name)))S.areas.push({id:newId(),name:d.name,group:d.group,notes:[],module:d.module})});
  const ix=a=>{const i=DEF_AREAS.findIndex(d=>norm(d.name)===norm(a.name));return i<0?999:i};
  S.areas=S.areas.map((a,i)=>[a,i]).sort((x,y)=>ix(x[0])-ix(y[0])||x[1]-y[1]).map(x=>x[0]);
  S.areasV=AREAS_V;
  return true;
}
let migrated=false;
function maybeMigrate(){if(mode==="loading"||migrated)return;migrated=true;if(migrateAreas()){["areas","tasks","goals","habits"].forEach(m=>persist(m));toast("Đã cập nhật Lĩnh vực theo bộ 17 mục mới")}}
function areaSpend(a,mk){const k=norm(a.name);return S.tx.filter(x=>x.type==="chi"&&monthKey(x.date)===mk&&(norm(x.cat)===k||norm(CAT_AREA[x.cat])===k)).reduce((s,x)=>s+x.amount,0)}
function areaInfo(a){
  const k=norm(a.name),t=today();
  const tasks=S.tasks.filter(x=>norm(x.tag)===k),open=tasks.filter(x=>!x.done);
  const overdue=open.filter(x=>x.due&&diffDays(x.due,t)<0).length;
  const goals=S.goals.filter(g=>norm(g.area)===k);
  const gp=goals.length?Math.round(goals.reduce((s,g)=>s+goalPct(g),0)/goals.length):null;
  const habits=(S.habits||[]).filter(h=>norm(h.area)===k);
  const sc=(a.scores||{})[monthKey(t)];
  return{tasks,open,overdue,goals,gp,habits,notes:a.notes||[],score:sc==null?null:sc};
}
function scoreCls(v){return v==null?"":v>=8?"ok":v>=5?"jade":"red"}
function prevMonth(mk){const d=parseD(mk+"-01");d.setMonth(d.getMonth()-1);return monthKey(ymd(d))}
function noteBody(a,n,clip){
  const lines=(n.text||"").split("\n");let html="",para=[],done=0,total=0;
  const flush=()=>{if(para.length){html+='<p>'+esc(para.join("\n"))+'</p>';para=[]}};
  lines.forEach((ln,i)=>{const m=ln.match(/^\s*(?:[-*]\s*)?\[( |x|X)\]\s?(.*)$/);
    if(m){flush();const ok=m[1]!==" ";total++;if(ok)done++;html+='<label class="step'+(ok?' done':'')+'"><input type="checkbox" class="check" data-act="note-check" data-area="'+a.id+'" data-id="'+n.id+'" data-i="'+i+'"'+(ok?' checked':'')+'><span>'+esc(m[2])+'</span></label>'}
    else para.push(ln)});
  flush();
  if(clip&&html.length>900&&!total)html='<p>'+esc((n.text||"").slice(0,220))+'…</p>';
  return{html,done,total};
}

function wheelSVG(areas,mk){
  const N=areas.length||1,step=Math.PI*2/N,r0=30,R=116,gap=0.012;
  const P=(r,a)=>(r*Math.cos(a)).toFixed(1)+" "+(r*Math.sin(a)).toFixed(1);
  const wedge=(r,s,e)=>'M'+P(r0,s)+'L'+P(r,s)+'A'+r+' '+r+' 0 0 1 '+P(r,e)+'L'+P(r0,e)+'A'+r0+' '+r0+' 0 0 0 '+P(r0,s)+'Z';
  let out="",rated=0,sum=0;
  areas.forEach((a,i)=>{const s=-Math.PI/2+i*step+gap,e=-Math.PI/2+(i+1)*step-gap,m=(s+e)/2;const v=(a.scores||{})[mk];
    if(v!=null){rated++;sum+=v}
    const rv=v!=null?r0+(R-r0)*v/10:0;
    const ix=(140*Math.cos(m)-9).toFixed(1),iy=(140*Math.sin(m)-9).toFixed(1);
    out+='<g class="wg g-'+(a.group||"life")+'" data-act="area-open" data-id="'+a.id+'"><title>'+esc(a.name)+': '+(v==null?'chưa chấm':v+'/10')+'</title><path d="'+wedge(R,s,e)+'" class="wt"/>'+(v!=null?'<path d="'+wedge(rv,s,e)+'" class="wv"/>':'')+'<svg x="'+ix+'" y="'+iy+'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="wi">'+areaPath(a)+'</svg></g>'});
  const avg=rated?(sum/rated).toFixed(1):"—";
  return '<svg class="wheel" viewBox="-162 -162 324 324" role="img" aria-label="Bánh xe cuộc sống: điểm trung bình '+avg+'"><circle r="'+(r0+(R-r0)/2)+'" class="wring"/>'+out+'<text y="2" class="wavg">'+avg+'</text><text y="20" class="wlbl">trung bình</text></svg>';
}

function gymMain(a,i,mk){
  const G=gymS(),t=today(),ws=gymWeekStart(t),sel=ui.gymDay||t,tab=ui.gymTab||"lib",g=G.goals;
  const wk=G.sessions.filter(x=>gymInWeek(x,ws)),km=wk.filter(x=>x.sport==="run").reduce((s,x)=>s+(+x.km||0),0);
  const cnt={gym:wk.filter(x=>x.sport==="gym").length,run:km,badminton:wk.filter(x=>x.sport==="badminton").length};
  const top='<div class="gym-top"><button type="button" class="icon-btn back" data-act="area-open" data-id="" aria-label="Về tổng quan lĩnh vực">'+icon("left",18)+'</button><b>Thể dục thể thao</b><span class="muted">'+wk.length+' buổi tuần này</span></div>';
  const week=[0,1,2,3,4,5,6].map(k=>{const d=addDays(ws,k),dow=parseD(d).getDay(),pl=G.plan.filter(p=>p.day===dow),dn=G.sessions.filter(x=>x.date===d);
    const ps=[...new Set(pl.map(p=>p.sport))],ds=[...new Set(dn.map(x=>x.sport))],icons=[...new Set([...ps,...ds])];
    const done=ps.length?ps.every(x=>ds.includes(x)):ds.length>0;
    const cls=done?'ok':(ps.length&&d<t?'miss':'');
    return '<button type="button" class="gym-day '+cls+(d===t?' today':'')+'" aria-pressed="'+(d===sel)+'" data-act="gym-day" data-v="'+d+'"><small>'+GYM_WD[k]+'</small><b>'+d.slice(8,10)+'</b><div class="gym-ico">'+(icons.map(x=>GYM_ICO[x]).join('')||'·')+'</div></button>'}).join('');
  const dsel=parseD(sel).getDay(),planned=G.plan.filter(p=>p.day===dsel).sort((x,y)=>String(x.time).localeCompare(String(y.time))),logged=G.sessions.filter(x=>x.date===sel);
  const day=planned.filter(p=>p.sport!=="gym"||!logged.some(x=>x.sport==="gym")).map(p=>{const dn=logged.some(x=>x.sport===p.sport);return p.sport==="gym"?'':'<span class="gym-chip'+(dn?' ok':'')+'">'+esc(p.time)+' '+GYM_ICO[p.sport]+(dn?' ✓':' <button type="button" class="gym-go" data-act="gym-go" data-v="'+p.sport+'">Ghi</button>')+'</span>'}).join('')
    +logged.filter(x=>!planned.some(p=>p.sport===x.sport)).map(x=>'<span class="gym-chip ok">'+GYM_ICO[x.sport]+' ✓</span>').join('');
  const sport=ui.gymSport&&SPORTS[ui.gymSport]?ui.gymSport:"gym";ui.gymSport=sport;
  const mini=(k,v,goal,u)=>{const pc=Math.min(100,goal?Math.round(v/goal*100):0);return '<button type="button" class="gym-m" data-act="gym-sport" data-v="'+k+'" aria-pressed="'+(sport===k)+'" title="'+SPORTS[k]+' · mục tiêu '+goal+' '+u+'"><span>'+GYM_ICO[k]+'</span><div class="gym-track"><i class="'+(goal&&v>=goal?'ok':'')+'" style="width:'+pc+'%"></i></div><b>'+(Math.round(v*10)/10)+'/'+goal+(u==='km'?'km':'')+'</b></button>'};
  const card='<div class="card sec gym-card"><div class="gym-week">'+week+'</div>'
    +'<div class="gym-today"><b>'+(sel===t?'Hôm nay':dateLabel(sel))+'</b>'+(day||'<span class="muted">Trống</span>')+'</div>'+gymDayDetail(G,sel)
    +'<div class="gym-mini">'+mini('gym',cnt.gym,g.gym,'buổi')+mini('run',cnt.run,g.run,'km')+mini('badminton',cnt.badminton,g.badminton,'buổi')+'</div></div>';
  const tabDefs=sport==="gym"?[["lib","Bài tập"],["plan","Kế hoạch"],["track","Thống kê"]]:[["log","Ghi buổi"],["plan","Kế hoạch"],["track","Thống kê"]];
  if(!tabDefs.some(([k])=>k===tab)){ui.gymTab=tabDefs[0][0]}
  const tab2=ui.gymTab;
  const tabs='<div class="seg gym-tabs t3" role="group" aria-label="Phần"><span class="gym-tabs-sp">'+GYM_ICO[sport]+'</span>'+tabDefs.map(([k,l])=>'<button type="button" data-act="gym-tab" data-v="'+k+'" aria-pressed="'+(tab2===k)+'">'+l+'</button>').join("")+'</div>';
  if(!GYM_EXDB&&typeof gymExdbLoad==="function")gymExdbLoad().then(()=>{if(gymExdbMerge())persist("gym");render()}).catch(()=>{});
  const body=tab2==="plan"?gymPlanTab(G):tab2==="track"?(sport==="gym"?gymTrackTab(G):gymSportTrack(G,sport)):tab2==="lib"?gymLibTab(G):gymLogTab(G);
  return top+card+'<div class="card sec">'+tabs+body+'</div>'
   +'<details class="ck-more"><summary>Ghi chú, việc và mục tiêu chung</summary><div class="ck-more-body">'+areaMain(a,i,mk)+'</div></details>';

function gymExLink(ex){const i=GYM_EXINFO[ex];return "https://www.youtube.com/results?search_query="+encodeURIComponent(i?i.q:ex+" hướng dẫn tập")}
function gymExLast(G,ex){let b=null;G.sessions.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date))).forEach(x=>(x.items||[]).forEach(i=>{if(i.ex===ex)b={s:+i.s||0,r:+i.r||0,k:+i.k||0,date:x.date}}));return b}
function gymExPR(G,ex){let b=null;G.sessions.forEach(x=>(x.items||[]).forEach(i=>{if(i.ex!==ex)return;const k=+i.k||0,r=+i.r||0;if(!b||k>b.k||(k===b.k&&r>b.r))b={k,r,date:x.date}}));return b}
function gymFav(ex){return (gymS().fav||[]).includes(ex)}
function gymFavSort(arr,key){const k=key||(x=>x);return arr.slice().sort((a,b)=>(gymFav(k(b))?1:0)-(gymFav(k(a))?1:0))}
function gymExMus(ex){const m=GYM_EXM[ex];if(m)return m;const u=(typeof gymExx==="function")?gymExx(ex):null;if(u&&u.p)return {p:u.p,s:u.s||[]};const g=gymS().lib.find(x=>x.ex.includes(ex));return {p:g?GYM_MUS_LIST.filter(x=>x.grp===g.g).map(x=>x.name):[],s:[]}}
function gymMusEx(name){const out=[];gymS().lib.forEach(g=>g.ex.forEach(e=>{const m=gymExMus(e);if(m.p.includes(name))out.push({ex:e,k:"p"});else if(m.s.includes(name))out.push({ex:e,k:"s"})}));return out.sort((a,b)=>(a.k>b.k?1:a.k<b.k?-1:0))}
function gymExCount(G,ex,days){const t=today();return G.sessions.filter(x=>diffDays(t,x.date)<days&&(x.items||[]).some(i=>i.ex===ex)).length}
function gymMusSets(G,name){const ws=gymWeekStart(today());let n=0;G.sessions.filter(x=>gymInWeek(x,ws)).forEach(x=>(x.items||[]).forEach(i=>{if(gymExMus(i.ex).p.includes(name))n+=(+i.s||0)}));return n}

  const frame=now=>{if(!live.isConnected){gymAnimStop(id);return}
    const t=Math.max(0,now-t0)%total,i=Math.floor(t/segT),u=spline?(t-i*segT)/segT:Math.min(1,(t-i*segT)/dur),a=seq[i],b=seq[i+1],k=spline?u:ease(u),p=spline?splineMix(i,u):gymPoseMix(a,b,k);

    if(host)host.innerHTML=gymFig(p);if(opt&&opt.onFrame)opt.onFrame(i,k,p);st.raf=requestAnimationFrame(frame)};

function gymRigClone(xb){
  const T=GYM_T,rig=xb.userData.rig;if(!rig)return null;
  const g=new T.Group();const root=new T.Bone();root.position.copy(rig.root.position);const bones=[root],info=[];
  rig.info.forEach(s=>{const b=new T.Bone();b.position.copy(s.restLocal);root.add(b);bones.push(b);info.push(Object.assign({},s,{bone:b}))});
  g.add(root);g.updateMatrixWorld(true);const skeleton=new T.Skeleton(bones);
  xb.traverse(m=>{if(!m.isSkinnedMesh)return;const m2=new T.SkinnedMesh(m.geometry,new T.MeshStandardMaterial({color:0xcccccc,roughness:0.65,metalness:0}));m2.name=m.name;m2.userData=m.userData;g.add(m2);m2.updateMatrixWorld(true);m2.bind(skeleton)});
  g.userData.rig={root,bones,info,J:rig.J,H:rig.H,skeleton};return g;
}
// Đặt tư thế cho một rig theo p; trả về hộp bao các khớp (trong không gian của group chứa rig)
function gymPoseRig(rig,p){
  const T=GYM_T,D=Math.PI/180,X=new T.Vector3(1,0,0),Y=new T.Vector3(0,1,0),Z=new T.Vector3(0,0,1),J=rig.J,P0=J.pelvis;
  const by={};rig.info.forEach(s=>{by[s.name]=s});
  if(!p){rig.info.forEach(s=>{s.bone.position.copy(s.restLocal);s.bone.quaternion.identity()});rig.root.quaternion.identity()}
  else{
    const V=x=>gymPV(p,x),VS=(x,s)=>s==="l"?gymPV(p,x+"L"):gymPV(p,x);
    const sideSign=s=>Math.sign(J["hip"+s].x)||1;
    const limbDir=(flex,abd,s)=>new T.Vector3(0,-1,0).applyAxisAngle(Z,sideSign(s)*abd*D).applyAxisAngle(X,-flex*D);
    // thân: gập trước (torso) · xoay quanh trục sống (tyaw) · nghiêng bên (tside)
    const tq=new T.Quaternion().setFromAxisAngle(X,V("torso")*D).multiply(new T.Quaternion().setFromAxisAngle(Y,V("tyaw")*D)).multiply(new T.Quaternion().setFromAxisAngle(Z,V("tside")*D));
    const up=new T.Vector3(0,1,0).applyQuaternion(tq);
    const set=(name,start,dir)=>{const s=by[name];s.bone.position.copy(start).sub(P0);s.bone.quaternion.setFromUnitVectors(s.dir,dir)};
    const setQ=(name,start,q)=>{const s=by[name];s.bone.position.copy(start).sub(P0);s.bone.quaternion.copy(q).multiply(new T.Quaternion().setFromUnitVectors(s.dir,Y))};
    set("pelvis",J.hipl,by.pelvis.dir);const neck=P0.clone().addScaledVector(up,by.torso.len);setQ("torso",P0,tq);setQ("head",neck,tq);
    const eq=p.eq||"",hi=gymHandItem(p);
    const standing=!GYM_SEATED.includes(eq)&&!["pullbar","dip"].includes(hi)&&!((eq==="cableTop")&&(V("thigh")>45))&&eq!=="kneel";
    const shrug=V("shrug")*0.035*rig.H;
    for(const s of ["r","l"]){const sh=J["sh"+s].clone().sub(P0).applyQuaternion(tq).add(P0).addScaledVector(up,shrug);
      const d1=limbDir(VS("arm",s),VS("aab",s),s),elb=sh.clone().addScaledVector(d1,by["uarm"+s].len);set("uarm"+s,sh,d1);
      const d2=limbDir(VS("fore",s),VS("fab",s),s),wr=elb.clone().addScaledVector(d2,by["farm"+s].len);set("farm"+s,elb,d2);
      const hd=VS("hand",s);set("hand"+s,wr,hd?d2.clone().applyAxisAngle(X,-hd*D):d2);
      const lab=VS("lab",s);
      const d3=limbDir(VS("thigh",s),lab-7,s),knee=J["hip"+s].clone().addScaledVector(d3,by["thigh"+s].len);set("thigh"+s,J["hip"+s],d3);
      const d4=limbDir(VS("shin",s),lab-7,s),ank=knee.clone().addScaledVector(d4,by["shin"+s].len);set("shin"+s,knee,d4);
      let fd=standing?new T.Vector3(0,0,1):(eq==="legpress"?new T.Vector3(0,1,0).applyQuaternion(tq):d4.clone().applyAxisAngle(X,-Math.PI/2));
      const ft=VS("foot",s);if(ft)fd=fd.applyAxisAngle(X,-ft*D);set("foot"+s,ank,fd)}
    const q=new T.Quaternion().setFromAxisAngle(X,V("rot")*D).multiply(new T.Quaternion().setFromAxisAngle(Z,V("roll")*D));
    rig.root.quaternion.copy(q)}
  rig.root.position.copy(J.pelvis);rig.root.updateMatrixWorld(true);
  // Neo điểm tựa cố định: xà/xà kép → tay; đứng/plank → bàn chân; ghế, nằm ngửa → hông; quỳ → gối; cầu hông → vai
  if(p){const eq=p.eq||"",hi=gymHandItem(p),seated=GYM_SEATED.includes(eq);
    const anc=p.anc||(hi==="pullbar"||hi==="dip"?"hand":seated?"hip":eq==="kneel"?"knee":eq==="cableTop"?((gymPV(p,"thigh"))>45?"hip":"foot"):eq==="floor"?((p.rot||0)<0?"hip":"hand"):"foot");
    if(anc!=="hip"){const wp=(n,end)=>{const s=by[n],v=new T.Vector3();if(end){v.copy(s.dir).multiplyScalar(s.len);s.bone.localToWorld(v)}else s.bone.getWorldPosition(v);return v};
      const a=anc==="hand"?wp("handr",1).add(wp("handl",1)).multiplyScalar(0.5):anc==="sh"?wp("uarmr").add(wp("uarml")).multiplyScalar(0.5):anc==="knee"?wp("thighr",1).add(wp("thighl",1)).multiplyScalar(0.5):anc==="footr"?wp("footr",1):anc==="footl"?wp("footl",1):wp("footr",1).add(wp("footl",1)).multiplyScalar(0.5);
      rig.refs=rig.refs||{};if(!rig.refs[anc])rig.refs[anc]=a.clone();
      rig.root.position.add(rig.refs[anc].clone().sub(a));rig.root.updateMatrixWorld(true)}}
  const box=new T.Box3(),v=new T.Vector3();
  rig.info.forEach(s=>{s.bone.getWorldPosition(v);box.expandByPoint(v);v.copy(s.dir).multiplyScalar(s.len);s.bone.localToWorld(v);box.expandByPoint(v)});
  return box;
}

function gymMoveProps(scene,poses,box,ex){
  const T=GYM_T,P={list:[]},metal=new T.MeshStandardMaterial({color:0x5b6a66,roughness:0.4,metalness:0.6}),plate=new T.MeshStandardMaterial({color:0x2f3a37,roughness:0.6,metalness:0.3}),
   pad=new T.MeshStandardMaterial({color:0x7d8f89,roughness:0.9}),frame=new T.MeshStandardMaterial({color:0x8a9a95,roughness:0.7,metalness:0.2}),floorM=new T.MeshStandardMaterial({color:0xcfd6d2,roughness:1,transparent:true,opacity:0.55});

  if(hh("kb")||hh("kb1")){P.kb={};for(const s of ["r","l"]){const g=new T.Group();const ball=new T.Mesh(new T.SphereGeometry(0.075,18,14),plate);ball.position.y=-0.12;g.add(ball);const hd=new T.Mesh(new T.TorusGeometry(0.06,0.012,8,20),metal);hd.position.y=-0.03;g.add(hd);P.kb[s]=add(g,"kb"+s)}}
  if(hh("grip")){P.grip={};for(const s of ["r","l"])P.grip[s]=add(cyl(0.016,0.14,metal),"grip"+s)}
  if(hh("cable")||hh("cable1")||hh("cable2")||hh("cableAnk")){const mk=()=>{const g=new T.Group();const pm=new T.Mesh(new T.BoxGeometry(0.08,2.2,0.08),frame);pm.position.y=1.1;g.add(pm);const pul=new T.Mesh(new T.TorusGeometry(0.06,0.012,8,20),metal);pul.rotation.y=Math.PI/2;g.add(pul);g.userData.pul=pul;return add(g,"cable")};
    const ln=()=>{const lg=new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3()]);return add(new T.Line(lg,new T.LineBasicMaterial({color:0x6b7a76})),"line")};
    P.cables=[{post:mk(),line:ln(),handle:add(cyl(0.012,0.25,metal),"handle")}];if(hh("cable2"))P.cables.push({post:mk(),line:ln(),handle:add(cyl(0.012,0.25,metal),"handle")})}
  if(hh("pullbar")){const g=new T.Group();g.add(cyl(0.016,1.3,metal));P.pullbar=add(g,"pullbar");P.pullPosts=[1,-1].map(()=>{const m=new T.Mesh(new T.BoxGeometry(0.06,1,0.06),frame);m.geometry.translate(0,-0.5,0);return add(m,"post")})}
  if(hh("dip")){P.dip={};for(const s of ["r","l"]){const b=new T.Mesh(new T.CylinderGeometry(0.018,0.018,0.8,12),metal);b.geometry.rotateX(Math.PI/2);P.dip[s]=add(b,"dip"+s)}P.dipPosts=[0,1,2,3].map(()=>{const m=new T.Mesh(new T.BoxGeometry(0.05,1,0.05),frame);m.geometry.translate(0,-0.5,0);return add(m,"post")})}
  if(has("bench")||has("benchT")||has("benchBar")||has("benchDb")){const g=new T.Group();const top=new T.Mesh(new T.BoxGeometry(0.32,0.07,1.25),pad);g.add(top);P.bench=add(g,"bench");P.posts=[0,1].map(()=>post(0.06));P.benchSeat=add(new T.Mesh(new T.BoxGeometry(0.32,0.07,0.36),pad),"benchSeat");P.benchSeatPost=post(0.06)}
  if(has("hack")){const g=new T.Group();const bk=new T.Mesh(new T.BoxGeometry(0.5,0.9,0.07),pad);bk.position.set(0,0.42,-0.1);g.add(bk);P.hkBack=add(g,"hkBack");P.hkPlat=add(new T.Mesh(new T.BoxGeometry(0.7,0.55,0.05),frame),"hkPlat");P.hkRails=[1,-1].map(()=>add(new T.Mesh(new T.CylinderGeometry(0.025,0.025,1,10),metal),"rail"));P.hkPost=post(0.1)}

  if(has("legpress")){const g=new T.Group();const bk=new T.Mesh(new T.BoxGeometry(0.5,0.84,0.07),pad);bk.position.set(0,0.44,-0.1);g.add(bk);P.lpBack=add(g,"lpBack");P.lpPan=add(new T.Mesh(new T.BoxGeometry(0.5,0.07,0.46),pad),"lpPan");
    P.lpPost=post(0.24);P.lpRails=[1,-1].map(()=>add(new T.Mesh(new T.CylinderGeometry(0.025,0.025,1,10),metal),"rail"));const pl=new T.Mesh(new T.BoxGeometry(0.6,0.5,0.05),frame);P.platform=add(pl,"platform")}

  const rk=ex==="Duỗi đùi"||/leg extension/i.test(ex)?"front":ex==="Gập đùi"||/lying leg curl/i.test(ex)?"back":ex==="Kéo cáp"||/pulldown/i.test(ex)?"thigh":null;if(rk){P.roller=add(cyl(0.055,0.44,pad,16),"roller");P.rollerKind=rk;P.rollerArm=add(new T.Mesh(new T.BoxGeometry(0.05,0.05,1),frame),"rollerArm")}
  const f=new T.Mesh(new T.BoxGeometry(3.2,0.02,3.2),floorM);P.floor=add(f,"floor");P.floorY=box.min.y-(has("legpress")||has("hack")?0.32:(hh("pullbar")||hh("dip"))?0.3:0);
  return P;
}
function gymMoveUpdateProps(M,p){
  const T=GYM_T,P=M.props;if(!P)return;const rig=M.rig,by={};rig.info.forEach(s=>{by[s.name]=s});
  const W=(n,end)=>{const s=by[n];const v=new T.Vector3();if(end){v.copy(s.dir).multiplyScalar(s.len);s.bone.localToWorld(v)}else s.bone.getWorldPosition(v);return v};
  const eq=p.eq||"",hi=gymHandItem(p),hr=W("handr",true),hl=W("handl",true),hm=hr.clone().add(hl).multiplyScalar(0.5),hx=hr.clone().sub(hl);if(hx.lengthSq()<1e-6)hx.set(1,0,0);hx.normalize();
  const pelvis=W("torso"),neck=W("torso",true),up=neck.clone().sub(pelvis).normalize(),right=W("pelvis",true).clone().sub(W("pelvis")).normalize();
  const tq=new T.Quaternion().setFromAxisAngle(new T.Vector3(1,0,0),(p.torso||0)*Math.PI/180),front=new T.Vector3(0,0,1).applyQuaternion(tq).applyQuaternion(rig.root.quaternion).normalize();
  const fh=new T.Vector3(front.x,0,front.z);if(fh.lengthSq()<1e-4)fh.set(0,0,1);fh.normalize();
  const qx=(v)=>new T.Quaternion().setFromUnitVectors(new T.Vector3(1,0,0),v);
  P.list.forEach(m=>{m.visible=false});
  const show=m=>{if(m)m.visible=true};
  const postTo=(pm,e)=>{show(pm);pm.position.set(e.x,P.floorY,e.z);pm.scale.y=Math.max(0.05,e.y-P.floorY)};
  if(P.bar&&hi==="bar"){show(P.bar);P.bar.position.copy(hm);if(P.bar.position.y<P.floorY+0.17)P.bar.position.y=P.floorY+0.17;P.bar.quaternion.copy(qx(hx));const hw=Math.max(0.2,hr.distanceTo(hl)/2),po=hw+0.14;P.bar.userData.shaft.scale.x=(2*po+0.3);P.bar.userData.plates.forEach(([sg,d,d2])=>{d.position.x=sg*po;d2.position.x=sg*(po+0.04)})}
  if(P.db&&(hi==="db"||hi==="db1")){for(const s of (hi==="db"?["r","l"]:["r"])){const d=P.db[s];show(d);d.position.copy(s==="r"?hr:hl);d.quaternion.copy(qx(hx))}}
  if(P.kb&&(hi==="kb"||hi==="kb1")){if(hi==="kb1"){const d=P.kb.r;show(d);d.position.copy(hr)}else for(const s of ["r","l"]){const d=P.kb[s];show(d);d.position.copy(s==="r"?hr:hl)}}
  if(P.grip&&hi==="grip"){for(const s of ["r","l"]){const d=P.grip[s];show(d);d.position.copy(s==="r"?hr:hl);d.quaternion.copy(qx(hx))}}
  if(P.pullbar&&hi==="pullbar"){show(P.pullbar);P.pullbar.position.copy(hm);P.pullbar.quaternion.copy(qx(hx));P.pullPosts.forEach((pm,i)=>{show(pm);const e=hm.clone().addScaledVector(hx,i?-0.62:0.62);pm.position.copy(e);pm.scale.y=Math.max(0.3,e.y-P.floorY)})}
  if(P.dip&&hi==="dip"){for(const s of ["r","l"]){const b=P.dip[s],c=s==="r"?hr:hl;show(b);b.position.copy(c);b.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),fh)}P.dipPosts.forEach((pm,i)=>{show(pm);const c=i<2?hr:hl;const e=c.clone().addScaledVector(fh,(i%2)?-0.35:0.35);pm.position.copy(e);pm.scale.y=Math.max(0.3,e.y-P.floorY)})}
  if(P.bench&&["bench","benchT","benchBar","benchDb"].includes(eq)){show(P.bench);const supine=(p.rot||0)<0;const n=front.clone().multiplyScalar(supine?-1:1);
    let axis=up,c,nn=n,L=1.25;
    if(eq==="benchT"){const td=W("thighr",true).clone().sub(W("thighr")).normalize();axis=td;nn=new T.Vector3().crossVectors(right,td).normalize();if(nn.y>0)nn.negate();c=pelvis.clone().addScaledVector(td,0.42).addScaledVector(nn,0.12)}
    else{ // đệm từ đầu tới hông; chỉ kéo dài xuống đùi khi đùi nằm dọc theo đệm (nằm sấp gập đùi, decline…) → chân không xuyên đệm
      const tHead=neck.clone().sub(pelvis).dot(up)+0.3;let tFoot=-0.12;

    // ghế nghiêng: thêm đệm ngồi nằm ngang dưới hông
    const incline=Math.abs(p.rot||0)>25&&Math.abs(p.rot||0)<80;if(P.benchSeat){if(incline){show(P.benchSeat);const sc=pelvis.clone().addScaledVector(fh,0.1);sc.y-=0.09;P.benchSeat.position.copy(sc);P.benchSeat.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right,new T.Vector3(0,1,0),fh));postTo(P.benchSeatPost,sc.clone().add(new T.Vector3(0,-0.03,0)))}}}
  if(P.hkBack&&eq==="hack"){show(P.hkBack);const c=pelvis.clone().addScaledVector(up,-0.02);P.hkBack.position.copy(c);P.hkBack.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right,up,front));
    if(!P.hkRef){const fr=W("footr"),fl=W("footl");P.hkRef={fm:fr.clone().add(fl).multiplyScalar(0.5).addScaledVector(up,-0.07),up:up.clone(),right:right.clone(),front:front.clone()}}const R=P.hkRef;
    show(P.hkPlat);P.hkPlat.position.copy(R.fm);P.hkPlat.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(R.right,R.front,R.up));
    P.hkRails.forEach((r,i)=>{show(r);const b=R.fm.clone().addScaledVector(R.right,(i?-1:1)*0.33).addScaledVector(R.front,-0.34);r.position.copy(b).addScaledVector(R.up,0.95);r.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),R.up);r.scale.y=1.9});
    postTo(P.hkPost,R.fm.clone().addScaledVector(R.front,-0.1))}
  if(P.smith&&p.sm&&P.bar&&P.bar.visible){if(!P.smRef){const hw=Math.max(0.2,hr.distanceTo(hl)/2);P.smRef={x:P.bar.position.x,z:P.bar.position.z,hx:hx.clone(),po:hw+0.3}}const R=P.smRef;P.smith.forEach((pm,i)=>{const e=new T.Vector3(R.x,P.floorY+2.15,R.z).addScaledVector(R.hx,(i?-1:1)*R.po);postTo(pm,e)})}
  if(P.lpBack&&eq==="legpress"){show(P.lpBack);const c=pelvis.clone().addScaledVector(up,-0.02);P.lpBack.position.copy(c);P.lpBack.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right,up,front));
    const panUp=new T.Vector3(0,1,0).addScaledVector(fh,-0.22).normalize(),panFwd=new T.Vector3().crossVectors(right,panUp).normalize();
    const pc=pelvis.clone().addScaledVector(panUp,-0.07).addScaledVector(panFwd,0.14);show(P.lpPan);P.lpPan.position.copy(pc);P.lpPan.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right,panUp,panFwd));postTo(P.lpPost,pc.clone().addScaledVector(panUp,-0.03));
    show(P.platform);const fr=W("footr"),fl=W("footl"),fm=fr.clone().add(fl).multiplyScalar(0.5),sd=front.clone(),u=new T.Vector3().crossVectors(sd,right).normalize();
    P.platform.position.copy(fm).addScaledVector(sd,0.035).addScaledVector(u,0.1);P.platform.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(right,u,sd));
    P.lpRails.forEach((r,i)=>{show(r);const sg=i?-1:1;const pt=P.platform.position.clone().addScaledVector(u,-0.2).addScaledVector(right,sg*0.34).addScaledVector(sd,-0.04);const L=Math.max(0.3,(pt.y-P.floorY)/Math.max(0.25,sd.y))+0.35;

const APP_BUILD="nhipsong-v111";
async function nsCheckUpdate(){try{const r=await fetch("sw.js?ts="+Date.now(),{cache:"no-store"});if(!r.ok)return;const m=(await r.text()).match(/nhipsong-v\d+/);if(!m||m[0]===APP_BUILD)return;
  let tried="";try{tried=sessionStorage.getItem("ns_upd")||""}catch(e){}
  const busy=(ui.gymDraft&&ui.gymDraft.length)||ui.gq||document.querySelector("#overlay .sheet");
  const go=async()=>{try{sessionStorage.setItem("ns_upd",m[0])}catch(e){}try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!=="nhipsong-img").map(k=>caches.delete(k)))}catch(e){}location.reload()};
  if(!busy&&tried!==m[0]){go();return}
  if(document.getElementById("ns-upd"))return;const b=document.createElement("button");b.id="ns-upd";b.type="button";b.className="ns-upd";b.textContent="⟳ Có bản mới — chạm để cập nhật";b.onclick=go;document.body.appendChild(b)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)nsCheckUpdate()});

let TRK=(()=>{try{return JSON.parse(localStorage.getItem("ns_trk"))||null}catch(e){return null}})(),trkW=null,trkI=null,trkWL=null;
function trkSave(){try{if(TRK)localStorage.setItem("ns_trk",JSON.stringify(TRK));else localStorage.removeItem("ns_trk")}catch(e){}}
function trkMs(){return TRK?TRK.acc+(TRK.st==="run"?Date.now()-TRK.seg:0):0}
function hhmm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function trkFmt(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60,p=n=>String(n).padStart(2,"0");return (h?h+":"+p(m):m)+":"+p(sec)}
function trkPace(){if(!TRK||!TRK.d||TRK.d<50)return "–";const sp=trkMs()/1000/(TRK.d/1000),m=Math.floor(sp/60),s=Math.round(sp%60);return m+"'"+String(s===60?59:s).padStart(2,"0")+'"/km'}
function trkTick(){if(!TRK)return;const t=$("#trk-t");if(t)t.textContent=trkFmt(trkMs());const d=$("#trk-d");if(d)d.textContent=(TRK.d/1000).toFixed(2);const p=$("#trk-p");if(p)p.textContent=trkPace();const g=$("#trk-g");if(g){const t=TRK.st==="pause"?"Đang tạm dừng":TRK.gps||"Đang tìm tín hiệu GPS…";g.title=t;g.dataset.s=TRK.st==="pause"?"p":/tốt/.test(t)?"g":/yếu|Chưa|Không/.test(t)?"w":"s"}}
function trkHav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function trkPos(pos){if(!TRK||TRK.st!=="run")return;const c=pos.coords;if(c.accuracy>35){TRK.gps="GPS yếu (±"+Math.round(c.accuracy)+" m) — ra chỗ thoáng hơn";trkTick();return}TRK.gps="GPS tốt (±"+Math.round(c.accuracy)+" m)";if(TRK.la==null){TRK.la=c.latitude;TRK.ln=c.longitude;TRK.lt=pos.timestamp}else{const d=trkHav(TRK.la,TRK.ln,c.latitude,c.longitude),dt=(pos.timestamp-TRK.lt)/1000;if(d>=Math.max(4,c.accuracy*.4)){if(dt<=0||d/dt<9){TRK.d+=d;TRK.la=c.latitude;TRK.ln=c.longitude;TRK.lt=pos.timestamp}else{TRK.la=c.latitude;TRK.ln=c.longitude;TRK.lt=pos.timestamp}}}trkSave();trkTick()}
function trkErr(e){if(!TRK)return;TRK.gps=e&&e.code===1?"Chưa cấp quyền vị trí — vẫn bấm giờ, nhập km tay":"Không lấy được GPS";trkTick()}
async function trkWake(){try{if(navigator.wakeLock&&TRK&&TRK.st==="run"&&!trkWL){trkWL=await navigator.wakeLock.request("screen");trkWL.addEventListener("release",()=>{trkWL=null})}}catch(e){}}
function trkRun(){if(!TRK)return;if(trkI)clearInterval(trkI);trkI=setInterval(trkTick,1000);if(TRK.sp==="run"&&!TRK.nogps&&TRK.st==="run"&&navigator.geolocation&&trkW==null){TRK.la=null;trkW=navigator.geolocation.watchPosition(trkPos,trkErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}trkWake()}
function trkHalt(){if(trkW!=null){navigator.geolocation.clearWatch(trkW);trkW=null}if(trkWL){try{trkWL.release()}catch(e){}trkWL=null}}
function trkStop(){if(trkI){clearInterval(trkI);trkI=null}trkHalt()}

function gymSportTrack(G,sp){
  const ws=gymWeekStart(today()),g=G.goals,all=G.sessions.filter(x=>x.sport===sp);
  const wks=[3,2,1,0].map(n=>{const s0=addDays(ws,-7*n),L=all.filter(x=>gymInWeek(x,s0));return {s:s0,v:sp==="run"?L.reduce((a,x)=>a+(+x.km||0),0):L.length,cur:n===0}});
  const mx=Math.max(1,...wks.map(w=>w.v));
  const trend=wks.map(w=>'<div class="gym-tc'+(w.cur?' cur':'')+'"><b>'+(Math.round(w.v*10)/10)+'</b><div class="gym-tb" style="height:'+Math.max(6,Math.round(w.v/mx*100))+'%"></div><small>'+w.s.slice(8,10)+'/'+w.s.slice(5,7)+'</small></div>').join('');
  const cur=wks[3].v,goal=sp==="run"?g.run:g.badminton,tot=sp==="run"?all.reduce((a,x)=>a+(+x.km||0),0):all.length,mins=all.reduce((a,x)=>a+(+x.minutes||0),0);
  const extra=sp==="badminton"?(()=>{const n=all.reduce((a,x)=>a+(+x.matches||0),0),w=all.reduce((a,x)=>a+(+x.won||0),0);return '<div class="gym-st"><b>'+(n?Math.round(w/n*100):0)+'<small>%</small></b><span>tỉ lệ thắng</span></div>'})():'<div class="gym-st"><b>'+(all.length?Math.round(tot/all.length*10)/10:0)+'<small> km</small></b><span>TB mỗi buổi</span></div>';
  return '<div class="gym-stats s3"><div class="gym-st"><b>'+(Math.round(cur*10)/10)+'<small>/'+goal+'</small></b><span>'+(sp==="run"?'km tuần này':'buổi tuần này')+'</span></div><div class="gym-st"><b>'+(Math.round(tot*10)/10)+'</b><span>'+(sp==="run"?'km tổng':'buổi tổng')+'</span></div>'+extra+'</div>'
   +'<div class="gym-exd-h">'+(sp==="run"?'Km':'Số buổi')+' 4 tuần</div><div class="gym-trend">'+trend+'</div>'
   +'<div class="gym-stats" style="margin-top:8px"><div class="gym-st"><b>'+Math.round(mins/60*10)/10+'<small> giờ</small></b><span>tổng thời gian</span></div><div class="gym-st"><b>'+gymStreak(G)+'</b><span>🔥 ngày liên tiếp (mọi môn)</span></div></div>';
}

/* ---------- Review tuần ---------- */
function vReview(){
  const end=addDays(today(),-7*ui.reviewOffset),days=[];for(let i=6;i>=0;i--)days.push(addDays(end,-i));
  const inR=d=>d&&d>=days[0]&&d<=days[6];
  let done=S.tasks.filter(t=>t.done&&inR(t.doneAt)).length;S.tasks.forEach(t=>(t.hist||[]).forEach(h=>{if(inR(h))done++}));
  const added=S.tasks.filter(t=>!t.done&&t.due&&inR(t.due)&&diffDays(t.due,today())<0).length;
  const daySpend=days.map(d=>sumBy(S.tx.filter(x=>x.date===d),"chi"));const total=daySpend.reduce((a,b)=>a+b,0);const max=Math.max(1,...daySpend);
  let hDone=0,hAll=0;S.habits.forEach(h=>days.forEach(d=>{hAll++;if(habitVal(h,d)>=h.target)hDone++}));
  const hp=hAll?Math.round(hDone/hAll*100):0;
  const moods=days.map(d=>S.journal[d]&&S.journal[d].mood).filter(x=>x!=null);
  const avgMood=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:null;
  const fastKept=days.filter(d=>(S.fasting.log||[]).includes(d)).length;
  const by={};S.tx.filter(x=>x.type==="chi"&&inR(x.date)).forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const lbl=parseD(days[0]).getDate()+"/"+(parseD(days[0]).getMonth()+1)+" – "+parseD(days[6]).getDate()+"/"+(parseD(days[6]).getMonth()+1);
  const nav='<div class="row" style="align-items:center"><button class="icon-btn" data-act="r-prev" aria-label="Tuần trước">'+icon("left")+'</button><span class="num" style="font-weight:600;min-width:110px;text-align:center">'+lbl+'</span><button class="icon-btn" data-act="r-next" aria-label="Tuần sau"'+(ui.reviewOffset===0?' disabled style="opacity:.3"':'')+'>'+icon("right")+'</button></div>';
  return head("Review tuần",ui.reviewOffset===0?"7 ngày vừa qua":"Tuần "+lbl,"",nav)
  +'<div class="card"><div class="stats"><div class="stat"><span class="k">Việc đã xong</span><span class="v">'+done+'</span></div><div class="stat"><span class="k">Đã chi</span><span class="v out">'+vndShort(total)+'</span></div><div class="stat"><span class="k">Thói quen đạt</span><span class="v">'+hp+'%</span></div><div class="stat"><span class="k">Giữ 16:8</span><span class="v">'+fastKept+'/7</span></div><div class="stat"><span class="k">Tâm trạng TB</span><span class="v">'+(avgMood==null?"—":MOODS[Math.round(avgMood)])+'</span></div></div></div>'
  +'<div class="grid gfill"><div class="card"><h2>Chi tiêu theo ngày</h2><div class="chart">'+days.map((d,i)=>'<div class="col"><span class="val">'+(daySpend[i]?vndShort(daySpend[i]):"")+'</span><div class="b" style="height:'+(daySpend[i]/max*100*0.78).toFixed(1)+'%"></div><span class="lbl">'+WD[parseD(d).getDay()]+'</span></div>').join("")+'</div>'+(top.length?'<p class="muted" style="margin:0">Chi nhiều nhất: '+top.map(([c,v])=>esc(c)+' '+vndShort(v)).join(" · ")+'</p>':'')+'</div>'
  +'<div class="card"><h2>Thói quen trong tuần</h2>'+(S.habits.length?S.habits.map(h=>{const k=days.filter(d=>habitVal(h,d)>=h.target).length;return '<div class="budget"><div class="l"><span>'+esc(h.name)+'</span><span>'+k+'/7 ngày</span></div><div class="bar'+(k<3?' warn':'')+'"><span style="width:'+(k/7*100)+'%"></span></div></div>'}).join(""):'<p class="empty">Chưa có thói quen.</p>')+'</div>'
  +'<div class="card"><h2>Ghi chú cho tuần sau</h2><p class="muted" style="margin:0">'+(added?'Có '+added+' việc bị trễ hạn trong tuần — cân nhắc dời ngày hoặc chia nhỏ.':'Không có việc nào bị trễ hạn trong tuần.')+(hp<50&&S.habits.length?' Tỉ lệ thói quen dưới 50%, thử giảm số thói quen xuống còn 2–3 cái quan trọng nhất.':'')+'</p></div></div>';
}

/* ---------- Toast ---------- */
let toastT=null;
// Đặt lịch nhắc lên Google Calendar của tài khoản người dùng chọn (điện thoại và máy tính cùng thấy).
// Nhắc trước bao nhiêu phút lấy từ localStorage "ns_remind_min" (mặc định 15).
let gcalTok=null;
function gcalToken(cb){
  const cid=(window.NS_CONFIG&&NS_CONFIG.googleClientId)||"";
  if(!cid){toast("Chưa cấu hình Google Client ID");return}
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){toast("Chưa tải được đăng nhập Google, thử lại sau");return}
  if(gcalTok&&gcalTok.exp>Date.now())return cb(gcalTok.t);
  const c=google.accounts.oauth2.initTokenClient({client_id:cid,scope:"https://www.googleapis.com/auth/calendar.events",
    callback:r=>{if(r&&r.access_token){gcalTok={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};cb(r.access_token)}else toast("Chưa đăng nhập Google")}});
  c.requestAccessToken({prompt:gcalTok?"":"consent"});
}
function gcalAddReminder(name,day,due){
  const mins=+(localStorage.getItem("ns_remind_min")||15)||15;
  if(!day||!due){toast("Chưa có giờ hạn");return}
  gcalToken(tok=>{
    const start=new Date(day+"T"+due+":00"),end=new Date(start.getTime()+30*60000);
    const ev={summary:name,description:"Nhịp Sống · checklist",start:{dateTime:start.toISOString()},end:{dateTime:end.toISOString()},
      reminders:{useDefault:false,overrides:[{method:"popup",minutes:mins}]}};
    fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{method:"POST",
      headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(ev)})
      .then(r=>toast(r.ok?"Đã đặt lịch, nhắc trước "+mins+" phút":"Không đặt được lịch ("+r.status+")"))
      .catch(()=>toast("Lỗi mạng, chưa đặt được lịch"));
  });
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

async function doExport(){

  }catch(e){if(e&&e.name==="AbortError")return}
  if(!downloads)return;
  try{await downloads.save({filename:name,data:text});toast("Đã lưu file sao lưu")}
  catch(e){if(e&&e.code!=="declined")toast("Không tạo được file sao lưu")}
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);let people;if(d&&d.v===2&&d.people&&d.people.self)people=d.people;else if(d&&Array.isArray(d.tasks))people={self:d};else throw 0;Object.keys(CACHE).forEach(k=>delete CACHE[k]);Object.keys(people).forEach(p=>{CACHE[p]=Object.assign(blankState(),people[p])});ui.person="self";loadActive();persistEverything();toast("Đã khôi phục dữ liệu");render()}catch(e){toast("File không đúng định dạng sao lưu của Nhịp Sống")}};
  r.readAsText(file);
}

function dayRes(y,m,d){const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;const k=y+"-"+pad(m)+"-"+pad(d);return {type:"day",key:k,from:k,to:k,label:"Ngày "+dateLabel(k)}}
function monRes(y,m){if(m<1||m>12)return null;const k=y+"-"+pad(m),last=pad(new Date(y,m,0).getDate());return {type:"month",key:k,from:k+"-01",to:k+"-"+last,label:"Tháng "+m+"/"+y}}
function yrRes(y){if(y<1900||y>2100)return null;return {type:"year",key:String(y),from:y+"-01-01",to:y+"-12-31",label:"Năm "+y}}
function parseOneCal(t){
  let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return dayRes(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/)))return dayRes(+m[3],+m[2],+m[1]);
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})$/)))return dayRes(+today().slice(0,4),+m[2],+m[1]);
  if((m=t.match(/^(?:tháng\s*)?(\d{1,2})[\/\-.\s]+(?:năm\s*)?(\d{4})$/)))return monRes(+m[2],+m[1]);
  if((m=t.match(/^tháng\s*(\d{1,2})$/)))return monRes(+today().slice(0,4),+m[1]);
  if((m=t.match(/^(?:năm\s*)?(\d{4})$/)))return yrRes(+m[1]);
  if(/^(hôm nay|hom nay|today)$/.test(t)){const d=today();{const r=dayRes(+d.slice(0,4),+d.slice(5,7),+d.slice(8,10));if(r)r.label="Hôm nay";return r}}
  return null;
}
function parseCalQuery(text){
  const q=String(text||"").trim().toLowerCase().replace(/\s+/g," ");
  if(!q)return null;
  const one=parseOneCal(q);if(one)return one;
  const m=q.match(/^(.+?)\s*(?:đến|–|—|\s-\s|-(?=\s*\d{1,2}[\/\-.]))\s*(.+)$/);
  if(!m)return null;
  const a=parseOneCal(m[1].trim()),b=parseOneCal(m[2].trim());
  if(!a||!b||a.from>b.to)return null;
  if(Math.round((parseD(b.to)-parseD(a.from))/864e5)>800)return null;
  return {type:"range",key:a.from+"|"+b.to,from:a.from,to:b.to,label:"Khoảng "+dateLabel(a.from)+" – "+dateLabel(b.to)};
}
function applyCal(r){
  ui.calPanel=false;ui.calJump=false;
  if(r.type==="range"){const days=[];for(let d=r.from;d<=r.to;d=addDays(d,1))days.push(d);ui.calScope="day";ui.calSel={day:days,month:[],year:[]};ui.calMonth=monthKey(r.from)}
  else if(r.type==="day"){ui.calScope="day";ui.calSel={day:[r.key],month:[],year:[]};ui.calMonth=monthKey(r.key)}
  else if(r.type==="month"){ui.calScope="month";ui.calSel={day:[],month:[r.key],year:[]};ui.calMonth=r.key}
  else{ui.calScope="year";ui.calSel={day:[],month:[],year:[r.key]};ui.calMonth=r.key+"-01"}
  render();
}
function calSugHtml(q){
  const t=today(),yr=+t.slice(0,4),ql=norm(q||"");const items=[];
  const pv=parseCalQuery(q);if(pv)items.push(pv);
  if(!ql||"homnay".includes(ql))items.push({type:"day",key:t,from:t,to:t,label:"Hôm nay"});
  for(let i=1;i<=12;i++){const label="Tháng "+i+"/"+yr;if(!ql||norm(label).includes(ql))items.push(monRes(yr,i)||{})}
  for(let y=yr-2;y<=yr+1;y++){const label="Năm "+y;if(!ql||norm(label).includes(ql))items.push(yrRes(y))}
  const html=items.filter(x=>x&&x.type).map(x=>'<button type="button" class="calsug-i" data-act="cal-apply" data-v="'+esc(JSON.stringify(x))+'">'+esc(x.label)+'</button>').join("");
  return html||'<p class="muted" style="margin:0">Không khớp. Thử: 05/09/2026, 09/2026, 2026, 01/09 - 15/09</p>';
}
